<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KEN SCHOOL – Từ vựng & Cấu trúc Tiếng Anh THCS – THPT</title>
<meta name="theme-color" content="#0f5c4d">
<style>
:root{--bg:#f3f7f6;--card:#fff;--ink:#1c2433;--muted:#667085;--line:#e1e8e6;--pri:#0f5c4d;--pri2:#13836d;--acc:#f59e0b;--ok:#1a9e5c;--okbg:#e6f6ee;--bad:#d64545;--badbg:#fdecec;--r:16px;
--g6:#22a06b;--g7:#1d7afc;--g8:#8f5cf6;--g9:#e2483d;--g10:#0e7490;--g11:#b45309;--g12:#be185d}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
header.top .brand{font-weight:800;cursor:pointer;white-space:nowrap}header.top .brand small{font-weight:500;opacity:.85;margin-left:6px}
header.top .sp{flex:1}header.top .who{font-size:13px;opacity:.92;text-align:right;line-height:1.25;max-width:45vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top .ib{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;padding:6px 10px;cursor:pointer}
main{max-width:1000px;margin:0 auto;padding:16px 14px 80px}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 2px rgba(16,24,40,.06),0 1px 8px rgba(16,24,40,.04);padding:18px;margin-bottom:14px}
h1,h2,h3{margin:0 0 8px;line-height:1.25}h1{font-size:24px}h2{font-size:20px}h3{font-size:17px}
.muted{color:var(--muted)}.small{font-size:13px}.center{text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600;min-height:44px;color:var(--ink)}
.btn.pri{background:var(--pri2);border-color:var(--pri2);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:6px 12px;font-size:14px;border-radius:10px}.btn.big{width:100%;font-size:17px;min-height:52px}.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:block;margin:10px 0 4px;font-weight:600;font-size:14px}
input.in,select.in,textarea.in{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:16px}
input.in:focus,textarea.in:focus,select.in:focus{outline:none;border-color:var(--pri2);box-shadow:0 0 0 3px rgba(19,131,109,.15)}
.err{color:var(--bad);font-size:14px;min-height:20px}
.goal{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{--p:0;width:116px;height:116px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),#e8edf0 0);display:grid;place-items:center;flex:none}
.ring>div{width:90px;height:90px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;line-height:1.1}.ring b{font-size:24px}.ring span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(80px,1fr));gap:10px;flex:1;min-width:240px}
.stat{background:var(--bg);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:21px}.stat span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:700}.tabs button.on{background:var(--c);border-color:var(--c);color:#fff}
.bar{height:10px;background:#e8edf0;border-radius:6px;overflow:hidden;margin:8px 0 6px}.bar>i{display:block;height:100%;background:var(--c,var(--ok));border-radius:6px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.un{border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:12px;cursor:pointer;background:#fff;text-align:left}
.un.done{background:var(--okbg);border-color:var(--ok);border-left-color:var(--ok)}.un.cur{box-shadow:0 0 0 3px rgba(19,131,109,.25)}.un small{color:var(--muted)}
.ls{display:grid;gap:8px}.lsi{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;cursor:pointer;text-align:left;width:100%}
.lsi .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--bg);font-size:19px;flex:none}.lsi.done{border-color:var(--ok);background:var(--okbg)}.lsi .t{flex:1}.lsi small{color:var(--muted)}
.plan{background:#fff8e6;border:1px solid #fde3a7;border-radius:12px;padding:10px 12px;font-size:14px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:13px;height:13px;border-radius:3px;background:#e8edf0}.heat i.l1{background:#b7e4c7}.heat i.l2{background:#74c69d}.heat i.l3{background:#2d9d63}.heat i.l4{background:#1b6e44}.heat i.today{outline:2px solid var(--pri2)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--bg);color:var(--muted)}
.fc{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.fc .w{font-size:34px;font-weight:800;color:var(--pri)}.fc .ipa{color:var(--muted);font-size:17px}.fc .vi{font-size:20px;font-weight:600}
.fc .ex{background:var(--bg);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:17px}.fc .ex b{color:var(--pri2)}
.say{border:0;background:var(--bg);border-radius:999px;width:40px;height:40px;cursor:pointer;font-size:18px}
.theory{background:#f0faf7;border:1px solid #cdebe3;border-radius:12px;padding:12px 16px}.theory li{margin:6px 0}
.exhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.steps{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 2px}.steps i{width:26px;height:8px;border-radius:4px;background:#e8edf0}.steps i.d{background:var(--ok)}.steps i.c{background:var(--pri2)}
.qbar{height:6px;background:#e8edf0;border-radius:4px;overflow:hidden;margin:10px 0 14px}.qbar>i{display:block;height:100%;background:var(--pri2)}
.q{font-size:20px;font-weight:700;margin:6px 0 4px}.q .big{font-size:30px;color:var(--pri)}
.sent{font-size:19px;background:var(--bg);border-radius:12px;padding:14px;margin:8px 0}.sent .gap{display:inline-block;min-width:80px;border-bottom:2.5px solid var(--pri2);text-align:center}.sent b{color:var(--pri2)}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;font-size:17px;min-height:50px}
.opt:hover{border-color:var(--pri2)}.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{border-radius:12px;padding:12px 14px;margin-top:12px}.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}.fb .t{font-weight:800}.fb.ok .t{color:var(--ok)}.fb.no .t{color:var(--bad)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.tile{min-width:42px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:20px;font-weight:700;cursor:pointer}.tile.used{visibility:hidden}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}.match .col{display:grid;gap:8px}
.mt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px;min-height:52px;cursor:pointer;font-size:16px;text-align:center}
.mt.sel{border-color:var(--pri2);box-shadow:0 0 0 3px rgba(19,131,109,.2)}.mt.done{border-color:var(--ok);background:var(--okbg);opacity:.6;cursor:default}.mt.shake{animation:sh .35s;border-color:var(--bad);background:var(--badbg)}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.score{font-size:54px;font-weight:900;line-height:1}.score.ok{color:var(--ok)}.score.no{color:var(--bad)}
table.t{width:100%;border-collapse:collapse;font-size:15px}table.t td,table.t th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.timer{font-variant-numeric:tabular-nums;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:grid;place-items:center;z-index:50;padding:16px}.modal .card{max-width:460px;width:100%;max-height:90vh;overflow:auto}
.hint{font-size:14px;color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600}.seg button.on{border-color:var(--pri2);background:#e7f5f1;color:var(--pri)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c2433;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:15px}
@media (max-width:560px){h1{font-size:21px}.fc .w{font-size:28px}main{padding:12px 10px 80px}.card{padding:14px}}
</style>
</head>
<body>
<header class="top"><div class="brand" id="home">🎒 KEN SCHOOL<small>Từ vựng & Cấu trúc · Lớp 6–12</small></div><div class="sp"></div><div class="who" id="who"></div><button class="ib" id="menuBtn">⚙️</button></header>
<main id="app"><div class="card center muted">Đang tải dữ liệu…</div></main>
<script src="data/units.js"></script>
<script>
'use strict';
var CONFIG = { PASS: 80, DAYS_PER_UNIT: 14, GOALS: [1, 2, 3], SCHOOLS: ['KEN CLASSES', 'VÕ NGUYÊN GIÁP', 'Ngoại Ngữ – ĐHTN', 'Lớp luyện tập'] };
var GRADES = [6, 7, 8, 9, 10, 11, 12];

/* ===== DỮ LIỆU ===== */
var UNITS = window.UNITS || [], BYN = {}, ALLW = [];
UNITS.forEach(function (u, ui) {
  u.key = u.g + '-' + u.u; u.idx = ui;
  u.lessons.forEach(function (s, si) {
    s.key = u.key + '-' + si; s.unit = u;
    if (s.type === 'v') s.words.forEach(function (w, wi) {
      w.n = s.key + '-' + wi; w.unit = u; w.form = (w.ex.match(/\{([^}]+)\}/) || [])[1] || w.w; BYN[w.n] = w; ALLW.push(w);
    });
    if (s.type === 'g') s.items.forEach(function (it, ii) { it.id = s.key + '-' + ii; it.les = s; });
  });
});
function unitsOf(g) { return UNITS.filter(function (u) { return u.g === g; }); }

/* ===== TIỆN ÍCH ===== */
var app = document.getElementById('app');
function $(s, r) { return (r || document).querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pick(a, k) { return shuffle(a).slice(0, k); }
function today(d) { d = d || new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function addDays(s, k) { var p = s.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]); d.setDate(d.getDate() + k); return today(d); }
function dayDiff(a, b) { var p = a.split('-'), q = b.split('-'); return Math.round((new Date(+q[0], +q[1] - 1, +q[2]) - new Date(+p[0], +p[1] - 1, +p[2])) / 864e5); }
function norm(s) { return String(s || '').toLowerCase().replace(/[’‘`]/g, "'").replace(/[.!?;:,]+$/, '').replace(/\s+/g, ' ').trim(); }
function sentHTML(o, mode) { return esc(o.ex).replace(/\{([^}]+)\}/, mode === 'gap' ? '<span class="gap">&nbsp;</span>' : '<b>$1</b>'); }
function plainEx(o) { return o.ex.replace(/[{}]/g, ''); }
function LSget(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function LSset(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function toast(m) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2200); }
function modal(title, html, okText, cancelText) {
  return new Promise(function (res) {
    var m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = '<div class="card"><h2>' + title + '</h2><div style="margin:8px 0 16px">' + html + '</div><div class="row" style="justify-content:flex-end">' + (cancelText ? '<button class="btn" data-v="0">' + cancelText + '</button>' : '') + '<button class="btn pri" data-v="1">' + (okText || 'OK') + '</button></div></div>';
    m.onclick = function (e) { var b = e.target.closest('[data-v]'); if (!b) return; m.remove(); res(b.getAttribute('data-v') === '1'); };
    document.body.appendChild(m);
  });
}
var voice = null;
function pickVoice() { if (!window.speechSynthesis) return; var vs = speechSynthesis.getVoices(); voice = vs.filter(function (v) { return /en-GB/i.test(v.lang); })[0] || vs.filter(function (v) { return /^en/i.test(v.lang); })[0] || null; }
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, rate) {
  if (!window.speechSynthesis) { toast('Trình duyệt không hỗ trợ đọc phát âm'); return; }
  speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(String(text).replace(/[{}]/g, '').replace(/___/g, 'blank'));
  u.lang = voice ? voice.lang : 'en-GB'; if (voice) u.voice = voice; u.rate = rate || (S && S.data.rate) || 0.9; speechSynthesis.speak(u);
}

/* ===== HỌC VIÊN & TIẾN ĐỘ ===== */
var student = LSget('ks_student', null), S = null;
function loadState() {
  var key = 'ks_' + (student.sid || 'guest').toLowerCase();
  var d = LSget(key, null) || { goal: 1, rate: 0.9, grade: student.grade || 6, les: {}, units: {}, words: {}, days: {}, lesson: null, tests: [] };
  S = { key: key, data: d, save: function () { LSset(key, d); } };
}
function day(k) { k = k || today(); var d = S.data.days[k]; if (!d) d = S.data.days[k] = { les: 0, q: 0, ok: 0, rev: 0 }; return d; }
function lesDone(s) { return (S.data.les[s.key] || {}).passed; }
function unitDone(u) { return u.lessons.every(lesDone) && (S.data.units[u.key] || {}).test >= CONFIG.PASS; }
function unitProgress(u) { var n = u.lessons.filter(lesDone).length + ((S.data.units[u.key] || {}).test >= CONFIG.PASS ? 1 : 0); return Math.round(n / (u.lessons.length + 1) * 100); }
function curUnit(g) { var us = unitsOf(g); for (var i = 0; i < us.length; i++) if (!unitDone(us[i])) return us[i]; return null; }
function streak() { var t = today(), c = 0, k = t, g = S.data.goal; if (!(S.data.days[k] && S.data.days[k].les >= g)) k = addDays(t, -1); while (S.data.days[k] && S.data.days[k].les >= g) { c++; k = addDays(k, -1); } return c; }
function dueWords() { var t = today(), out = []; for (var k in S.data.words) if (S.data.words[k].due <= t && BYN[k]) out.push(k); return out; }
function recordAnswer(n, ok) { var d = day(); d.q++; if (ok) d.ok++; var w = n && S.data.words[n]; if (w) { if (ok) w.r = (w.r || 0) + 1; else w.x = (w.x || 0) + 1; } }
function updateWho() { $('#who').innerHTML = student ? esc(student.name) + '<br><span style="opacity:.85">Lớp ' + S.data.grade + ' · ' + esc(student.cls) + ' · 🔥 ' + streak() + '</span>' : ''; }
function startUnitClock(u) { var st = S.data.units[u.key] || (S.data.units[u.key] = {}); if (!st.start) { st.start = today(); S.save(); } return st; }

/* ===== ĐĂNG NHẬP ===== */
function renderLogin() {
  var st = student || {};
  app.innerHTML = '<div class="card" style="max-width:520px;margin:4vh auto"><h1>Chào mừng đến KEN SCHOOL 👋</h1><p class="muted">Luyện <b>từ vựng</b> và <b>cấu trúc</b> Tiếng Anh theo từng unit, lớp 6 đến lớp 12. Lộ trình <b>2 tuần / 1 unit</b>, mỗi ngày một bài nhỏ. Mỗi bài tập cần đạt từ <b>' + CONFIG.PASS + '%</b> trở lên mới được qua.</p>' +
    '<form id="lf"><label class="f">Họ và tên</label><input class="in" name="name" required value="' + esc(st.name || '') + '"><label class="f">Mã HS</label><input class="in" name="sid" required value="' + esc(st.sid || '') + '">' +
    '<label class="f">Trường</label><select class="in" name="school">' + CONFIG.SCHOOLS.concat(['Khác']).map(function (s) { return '<option' + (st.school === s ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select><input class="in" name="other" placeholder="Nhập tên trường" style="margin-top:8px;display:none">' +
    '<label class="f">Lớp</label><input class="in" name="cls" required placeholder="VD: 6A1" value="' + esc(st.cls || '') + '">' +
    '<label class="f">Học chương trình khối</label><select class="in" name="grade">' + GRADES.map(function (g) { return '<option value="' + g + '"' + ((st.grade || 6) == g ? ' selected' : '') + '>Lớp ' + g + (unitsOf(g).length ? '' : ' (đang cập nhật)') + '</option>'; }).join('') + '</select>' +
    '<div class="err" id="lerr"></div><button class="btn pri big">Bắt đầu học</button></form></div>';
  var f = $('#lf'), sel = f.school, other = f.other; function tog() { other.style.display = sel.value === 'Khác' ? 'block' : 'none'; } sel.onchange = tog; tog();
  f.onsubmit = function (e) {
    e.preventDefault();
    var s = { name: f.name.value.trim(), sid: f.sid.value.trim(), school: sel.value === 'Khác' ? other.value.trim() : sel.value, cls: f.cls.value.trim(), grade: +f.grade.value };
    if (!s.name || !s.sid || !s.school || !s.cls) { $('#lerr').textContent = 'Vui lòng điền đủ thông tin.'; return; }
    student = s; LSset('ks_student', s); loadState(); S.data.grade = s.grade; S.save(); updateWho(); renderHome();
  };
}

/* ===== TRANG CHÍNH ===== */
function heatmap() {
  var t = today(), cells = '', start = addDays(t, -(7 * 16 - 1)), p = start.split('-'), dow = (new Date(+p[0], +p[1] - 1, +p[2]).getDay() + 6) % 7;
  for (var i = 0; i < dow; i++) cells += '<i style="visibility:hidden"></i>';
  for (var k = start; k <= t; k = addDays(k, 1)) { var d = S.data.days[k], g = S.data.goal, cl = !d || (!d.les && !d.rev && !d.q) ? '' : d.les >= g * 2 ? 'l4' : d.les >= g ? 'l3' : d.les ? 'l2' : 'l1'; cells += '<i class="' + cl + (k === t ? ' today' : '') + '" title="' + k + ': ' + (d ? d.les + ' bài, ' + d.rev + ' lượt ôn' : 'chưa học') + '"></i>'; }
  return '<div class="heat">' + cells + '</div><div class="small muted" style="margin-top:6px">Ô càng đậm = học càng nhiều · ô viền xanh = hôm nay</div>';
}
function planHTML(u) {
  var st = S.data.units[u.key] || {}, n = u.lessons.length, left = u.lessons.filter(function (s) { return !lesDone(s); }).length;
  if (!st.start) return '<div class="plan">📅 Lộ trình 2 tuần: ' + n + ' bài học + ôn tập + kiểm tra cuối unit. Bấm vào bài đầu tiên để bắt đầu.</div>';
  var d = dayDiff(st.start, today()) + 1, wk = d <= 7 ? 1 : 2, target = Math.min(n, Math.ceil(n * Math.min(d, 10) / 10)), done = n - left;
  var msg = d > CONFIG.DAYS_PER_UNIT ? '⏰ Đã quá 2 tuần, hãy hoàn thành nốt unit này nhé!' : done >= target ? '👍 Đúng tiến độ.' : '⚠️ Chậm ' + (target - done) + ' bài so với lộ trình.';
  return '<div class="plan">📅 <b>Tuần ' + Math.min(wk, 2) + '/2 · Ngày ' + Math.min(d, 14) + '/14</b> của unit. Đã xong ' + done + '/' + n + ' bài (nên xong ' + target + ' bài đến hôm nay). ' + msg + (left === 0 ? ' Ngày 11–14: ôn tập và làm <b>Kiểm tra cuối unit</b>.' : '') + '</div>';
}
function renderHome() {
  if (!student) return renderLogin();
  app.onclick = null; updateWho(); window.scrollTo(0, 0);
  var g = S.data.grade, d = day(), goal = S.data.goal, pct = Math.min(100, Math.round(d.les / goal * 100)), cu = curUnit(g), due = dueWords().length, us = unitsOf(g);

/* ===== TRÌNH CHẠY ===== */
function runQuiz(title, items, opt, done) {
  var i = 0, right = 0, wrongs = [], answers = [], t0 = Date.now(), timer = null;
  if (opt.seconds) { var end = Date.now() + opt.seconds * 1000; timer = setInterval(function () { var s = Math.max(0, Math.round((end - Date.now()) / 1000)), el = $('#tm'); if (el) el.textContent = Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); if (!s) { clearInterval(timer); finish(); } }, 500); }
  function finish() { clearInterval(timer); done(items.length ? Math.round(right / items.length * 100) : 0, wrongs, answers, Math.round((Date.now() - t0) / 1000)); }
  function show() {
    if (i >= items.length) return finish();
    var q = items[i]; window.scrollTo(0, 0);
    var body = q.opts ? '<div class="opts">' + q.opts.map(function (t, k) { return '<button class="opt" data-k="' + k + '">' + String.fromCharCode(65 + k) + '. ' + esc(t) + '</button>'; }).join('') + '</div>'
      : '<div style="margin-top:10px"><input class="in" id="ans" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Gõ câu trả lời…"></div>' + (q.tiles ? '<div class="row" style="margin-top:8px"><button class="btn sm" id="bk">⌫ Xóa chữ</button><button class="btn sm" id="clr">Xóa hết</button></div>' : '') + '<div class="row" style="margin-top:12px"><button class="btn pri" id="chk">Kiểm tra</button>' + (opt.feedback ? '<button class="btn ghost" id="idk">Tôi không biết</button>' : '') + '</div>';
    app.innerHTML = '<div class="card">' + (opt.head ? opt.head() : lessonHead(title)) + '<div class="row" style="justify-content:space-between;margin-top:6px"><span class="small muted">Câu ' + (i + 1) + '/' + items.length + ' · ' + TYPES[q.type].icon + ' ' + TYPES[q.type].name + '</span>' + (opt.seconds ? '<span class="timer">⏱ <span id="tm"></span></span>' : '<span class="small muted">Đúng: ' + right + '</span>') + '</div>' +
      '<div class="qbar"><i style="width:' + (i / items.length * 100) + '%"></i></div>' + q.prompt + body + '<div id="fb"></div></div>';
    bindQuit(); if (q.sayNow) setTimeout(function () { say(q.sayNow); }, 250);
    var answered = false;
    function judge(ok, given) {
      if (answered) return; answered = true; if (ok) right++; else wrongs.push(q.gram ? q : q.word); answers.push({ q: q, ok: ok, given: given });
      recordAnswer(q.word ? q.word.n : null, ok); if (opt.onAnswer) opt.onAnswer(q, ok); S.save();
      if (!opt.feedback) { i++; return show(); }
      var corr = q.opts ? q.opts[q.ans] : q.accept[0], extra = '';
      if (q.word) { var o = q.word; extra = '<div><b>' + esc(o.w) + '</b> ' + esc(o.ipa || '') + ': ' + esc(o.vi) + ' <button class="say" data-say="' + esc(o.w) + '">🔊</button></div><div class="small" style="margin-top:4px">' + sentHTML(o, 'bold') + '</div>'; }
      else { extra = '<div class="small">' + esc(q.gram.q.replace('___', '[' + corr + ']')) + '</div><div class="small muted" style="margin-top:4px">Xem lại lý thuyết: ' + esc(q.gram.les.title) + '</div>'; }
      $('#fb').innerHTML = '<div class="fb ' + (ok ? 'ok' : 'no') + '"><div class="t">' + (ok ? '✓ Chính xác!' : '✗ Chưa đúng. Đáp án: ' + esc(corr)) + '</div>' + extra + '</div><button class="btn pri big" id="nx" style="margin-top:12px">' + (i < items.length - 1 ? 'Câu tiếp theo →' : 'Xem kết quả') + '</button>';
      var nx = $('#nx'); nx.focus({ preventScroll: true }); nx.onclick = function () { i++; show(); };
      if (q.opts) app.querySelectorAll('.opt').forEach(function (b) { b.disabled = true; }); else { $('#ans').disabled = true; $('#chk').disabled = true; if ($('#idk')) $('#idk').disabled = true; }
      $('#fb').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    if (q.opts) app.querySelector('.opts').onclick = function (e) { var b = e.target.closest('.opt'); if (!b || answered) return; var k = +b.dataset.k, ok = k === q.ans; if (opt.feedback) { b.classList.add(ok ? 'right' : 'wrong'); app.querySelectorAll('.opt')[q.ans].classList.add('right'); } judge(ok, q.opts[k]); };
    else {
      var inp = $('#ans'); if (!q.tiles) setTimeout(function () { inp.focus(); }, 50);
      var check = function () { var v = norm(inp.value); if (!v) { inp.focus(); return; } judge(q.accept.some(function (a) { return norm(a) === v; }), inp.value); };
      $('#chk').onclick = check; inp.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); if (!answered) check(); else if ($('#nx')) $('#nx').click(); } };
      if ($('#idk')) $('#idk').onclick = function () { judge(false, ''); };
      if (q.tiles) { var stack = []; app.querySelector('.tiles').onclick = function (e) { var b = e.target.closest('.tile'); if (!b || answered) return; b.classList.add('used'); stack.push(b); inp.value += b.textContent; }; $('#bk').onclick = function () { var b = stack.pop(); if (b) { b.classList.remove('used'); inp.value = inp.value.slice(0, -1); } }; $('#clr').onclick = function () { stack.forEach(function (b) { b.classList.remove('used'); }); stack = []; inp.value = ''; }; }
    }
  }
  show();
}
function runMatch(title, words, n, done) {
  var all = pick(words, Math.min(n, words.length)), rounds = [], right = 0, wrongs = [], total = all.length, r = 0;
  for (var i = 0; i < all.length; i += 5) rounds.push(all.slice(i, i + 5));
  if (rounds.length > 1 && rounds[rounds.length - 1].length < 3) { var l = rounds.pop(); rounds[rounds.length - 1] = rounds[rounds.length - 1].concat(l); }
  function round() {
    if (r >= rounds.length) return done(Math.round(right / total * 100), wrongs);
    var ws = rounds[r], left = shuffle(ws), rc = shuffle(ws), sel = null, missed = {}, matched = 0;
    app.innerHTML = '<div class="card">' + lessonHead(title) + '<div class="small muted" style="margin-top:6px">Lượt ' + (r + 1) + '/' + rounds.length + ' · Chạm một từ rồi chạm nghĩa tương ứng. Ghép sai lần đầu sẽ bị tính sai.</div><div class="qbar"><i style="width:' + (r / rounds.length * 100) + '%"></i></div><div class="match"><div class="col">' + left.map(function (o) { return '<button class="mt" data-l="' + o.n + '"><b>' + esc(o.w) + '</b></button>'; }).join('') + '</div><div class="col">' + rc.map(function (o) { return '<button class="mt" data-r="' + o.n + '">' + esc(o.vi) + '</button>'; }).join('') + '</div></div></div>';
    bindQuit();
    app.querySelector('.match').onclick = function (e) {
      var b = e.target.closest('.mt'); if (!b || b.classList.contains('done')) return;
      if (b.dataset.l) { app.querySelectorAll('[data-l]').forEach(function (x) { x.classList.remove('sel'); }); b.classList.add('sel'); sel = b; say(BYN[b.dataset.l].w); return; }
      if (!sel) return; var ln = sel.dataset.l, ok = ln === b.dataset.r || BYN[ln].vi === BYN[b.dataset.r].vi;
      if (ok) { sel.classList.remove('sel'); sel.classList.add('done'); b.classList.add('done'); matched++; if (!missed[ln]) right++; sel = null; if (matched === ws.length) setTimeout(function () { r++; round(); }, 450); }
      else { b.classList.add('shake'); setTimeout(function () { b.classList.remove('shake'); }, 400); if (!missed[ln]) { missed[ln] = 1; wrongs.push(BYN[ln]); } }
    };
  }
  round();
}
function resultPage(title, score, wrongs, again, extra, back) {
  window.scrollTo(0, 0); updateWho();
  app.innerHTML = '<div class="card center"><h2>' + title + '</h2><div class="score ' + (score >= CONFIG.PASS ? 'ok' : 'no') + '" style="margin:14px 0">' + score + '%</div>' + (extra || '') + (wrongs.length ? '<div style="text-align:left"><h3>Cần xem lại (' + wrongs.length + ')</h3>' + wrongTable(wrongs) + '</div>' : '<p>Không sai câu nào. Xuất sắc! 🌟</p>') +
    '<div class="row" style="justify-content:center;margin-top:14px"><button class="btn" id="home2">← Quay lại</button>' + (again ? '<button class="btn pri" id="again">Làm lại</button>' : '') + '</div></div>';
  $('#home2').onclick = back || renderHome; if (again) $('#again').onclick = again;
}
function mixedItems(words, grams, n) {
  var vt = ['en2vi', 'vi2en', 'ctx', 'ctxmean', 'spell', 'form', 'listen'], items = [];
  var nw = Math.min(words.length, grams.length ? Math.round(n * 0.55) : n), ng = Math.min(grams.length, n - nw);
  pick(words, nw).forEach(function (o, k) { items.push(makeQ(vt[k % vt.length], o, words.length > 8 ? words : ALLW)); });
  pick(grams, ng).forEach(function (it) { items.push(grammarQ(it)); });
  return shuffle(items);
}
function unitTest(u) {
  L = null; app.onclick = null;
  var grams = []; u.lessons.forEach(function (s) { if (s.type === 'g') grams = grams.concat(s.items); });
  var items = mixedItems(unitPool(u), grams, 30), label = '📝 Kiểm tra cuối Unit ' + u.u + ': ' + u.title;
  runQuiz(label, items, { feedback: false, seconds: 15 * 60, head: function () { return '<div class="exhead"><button class="btn sm" id="quit">✕ Thoát</button><b>' + esc(label) + '</b></div>'; } }, function (score, wrongs, answers, secs) {
    var st = startUnitClock(u); st.test = Math.max(st.test || 0, score); S.data.tests.unshift({ d: today(), k: 'L' + u.g + ' U' + u.u, score: score }); if (score >= CONFIG.PASS) day().les += 0; S.save();
    var extra = '<p>' + (score >= CONFIG.PASS ? '✅ Đạt! Bạn đã hoàn thành Unit ' + u.u + '.' : '❌ Chưa đạt (cần từ ' + CONFIG.PASS + '% trở lên). Ôn lại các bài rồi làm lại nhé.') + '</p><p class="muted">' + answers.filter(function (a) { return a.ok; }).length + '/' + items.length + ' câu đúng · ' + Math.floor(secs / 60) + ' phút ' + secs % 60 + ' giây</p>';
    resultPage(label, score, wrongs, function () { unitTest(u); }, extra, function () { renderUnit(u); });
  });
}

/* ===== ÔN TẬP & LUYỆN TẬP ===== */
var SRS = [0, 1, 2, 4, 7, 15, 30, 60];
function startReview() {
  var due = shuffle(dueWords()).slice(0, 25).map(function (n) { return BYN[n]; }); if (!due.length) return toast('Hôm nay không có từ cần ôn.');
  var ts = ['en2vi', 'vi2en', 'ctx', 'spell', 'form', 'listen', 'ctxmean', 'dict'], pool = ALLW.filter(function (o) { return S.data.words[o.n]; }); if (pool.length < 8) pool = ALLW;
  var items = due.map(function (o, k) { return makeQ(ts[k % ts.length], o, pool); }); L = null;
  runQuiz('Ôn tập', items, { feedback: true, head: function () { return '<div class="exhead"><button class="btn sm" id="quit">✕ Thoát</button><b>🔁 Ôn từ vựng theo lịch</b></div>'; }, onAnswer: function (q, ok) { var w = S.data.words[q.word.n]; if (!w) return; w.b = ok ? Math.min(SRS.length - 1, (w.b || 1) + 1) : 1; w.due = addDays(today(), ok ? SRS[w.b] : 1); day().rev++; } },
    function (sc, wr) { resultPage('🔁 Ôn tập xong', sc, wr, startReview); });
}
function renderPracticeSetup() {
  app.onclick = null; window.scrollTo(0, 0); var g = S.data.grade, us = unitsOf(g);
  if (!us.length) return toast('Chưa có nội dung cho lớp ' + g);
  app.innerHTML = '<div class="card"><div class="row"><button class="btn sm" id="back">← Trang chính</button><h2 style="margin:0">🎯 Luyện tập tổng hợp – Lớp ' + g + '</h2></div><p class="muted">Chọn các unit muốn luyện (mặc định: các unit đã học).</p>' +
    '<div class="ls">' + us.map(function (u) { var on = u.lessons.some(lesDone); return '<label class="lsi"><input type="checkbox" value="' + u.idx + '"' + (on ? ' checked' : '') + '> <span class="t"><b>Unit ' + u.u + ': ' + esc(u.title) + '</b></span></label>'; }).join('') + '</div>' +
    '<label class="f">Nội dung</label><div class="seg" id="kind"><button data-v="mix" class="on">Từ vựng + Cấu trúc</button><button data-v="v">Chỉ từ vựng</button><button data-v="g">Chỉ cấu trúc</button></div>' +
    '<div class="row" style="margin-top:14px"><button class="btn pri" id="go">▶ Luyện 20 câu (xem đáp án từng câu)</button><button class="btn" id="test">📝 Kiểm tra 40 câu / 20 phút</button></div></div>';
  var kind = 'mix'; $('#kind').onclick = function (e) { var b = e.target.closest('button'); if (!b) return; kind = b.dataset.v; this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); }); };
  $('#back').onclick = renderHome;
  function run(test) {
    var sel = [].slice.call(app.querySelectorAll('input[type=checkbox]:checked')).map(function (c) { return UNITS[+c.value]; }); if (!sel.length) sel = us;
    var ws = [], gs = []; sel.forEach(function (u) { ws = ws.concat(unitPool(u)); u.lessons.forEach(function (s) { if (s.type === 'g') gs = gs.concat(s.items); }); });
    var n = test ? 40 : 20, items = kind === 'v' ? mixedItems(ws, [], n) : kind === 'g' ? pick(gs, n).map(grammarQ) : mixedItems(ws, gs, n), label = (test ? '📝 Kiểm tra' : '🎯 Luyện tập') + ' Lớp ' + g;
    L = null; runQuiz(label, items, { feedback: !test, seconds: test ? 1200 : 0, head: function () { return '<div class="exhead"><button class="btn sm" id="quit">✕ Thoát</button><b>' + label + '</b></div>'; } }, function (sc, wr, ans, secs) { if (test) { S.data.tests.unshift({ d: today(), k: 'L' + g + ' tổng hợp', score: sc }); S.save(); } resultPage(label, sc, wr, function () { run(test); }, '<p class="muted">' + ans.filter(function (a) { return a.ok; }).length + '/' + items.length + ' câu đúng</p>'); });
  }
  $('#go').onclick = function () { run(false); }; $('#test').onclick = function () { run(true); };
}
function copyReport() {
  var g = S.data.grade, lines = ['KEN SCHOOL – BÁO CÁO TIẾN ĐỘ', 'Học sinh: ' + student.name + ' (' + student.sid + ') – Lớp ' + student.cls + ' – ' + student.school, 'Ngày: ' + today() + ' · Đang học chương trình lớp ' + g, 'Chuỗi ngày đạt mục tiêu: ' + streak()];

/* ===== GIÁM SÁT: không được rời tab / chuyển ứng dụng khi đang học (chỉ cảnh báo, ghi vào báo cáo) ===== */
