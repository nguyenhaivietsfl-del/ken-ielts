<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c5c">
<title>KEN – Lesson Planning with ICT in ELT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14232b;--muted:#5d6b73;--bg:#f6f2eb;--card:#fff;--line:#e4ddd1;--brand:#0f4c5c;--brand2:#1d6f80;--soft:#e8f1f2;--accent:#f0a53a;--ok:#2b8a57;--okbg:#e6f4ec;--bad:#c4473d;--badbg:#fbeae8;--ai:#5a3ea8;--aibg:#efe9fb}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.55;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--brand2)}
.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px clamp(16px,4vw,40px);padding-top:max(12px,env(safe-area-inset-top));background:var(--brand);color:#fff}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;color:#fff;text-decoration:none;font-size:17px}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:15px}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:14px;background:rgba(255,255,255,.12);border:0;color:#fff;padding:6px 12px;border-radius:999px;cursor:pointer;font-family:inherit;max-width:55vw}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main#app{width:100%;max-width:1200px;margin:0 auto;padding:clamp(16px,4vw,40px);flex:1}
footer{text-align:center;color:var(--muted);font-size:13px;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
footer button{background:none;border:0;color:var(--brand2);font:inherit;text-decoration:underline;cursor:pointer}
.demo-banner{background:#fff4dc;color:#7a5200;font-size:13px;text-align:center;padding:7px 12px;border-bottom:1px solid #f1dfb4}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(30px,5.2vw,46px);letter-spacing:-.5px}
h2{font-size:clamp(20px,3vw,24px)}
h3{font-size:18px}
.eyebrow{display:inline-block;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--brand2);background:var(--soft);padding:5px 10px;border-radius:999px}
.lead{color:var(--muted);font-size:17px;max-width:52ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,3vw,28px);box-shadow:0 10px 30px -18px rgba(15,76,92,.35)}
.hero{display:grid;gap:30px;align-items:center}
@media(min-width:860px){.hero{grid-template-columns:1.05fr 1fr;min-height:62vh}}
.hero-points{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.hero-points span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:14px}
label small{font-weight:400;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;width:100%;margin-top:6px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px rgba(29,111,128,.16)}
.err-text{color:var(--bad);font-size:14px;min-height:1.2em;margin:-4px 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;border:1.5px solid transparent;font:inherit;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .08s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand2)}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn.ai{background:var(--aibg);color:var(--ai);border-color:#d9cdf5}
.btn.big{width:100%;min-height:52px;font-size:16px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.tests{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.tcard{display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;position:relative;overflow:hidden}
.tcard::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--brand2)}
.tcard.c2::before{background:var(--accent)}
.tcard h3{margin:4px 0 0}
.tcard img{width:100%;height:150px;object-fit:cover;object-position:top;border-radius:10px;border:1px solid var(--line)}
.meta{display:flex;gap:10px;color:var(--muted);font-size:13.5px;flex-wrap:wrap}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--soft);color:var(--brand);align-self:flex-start}
.tcard .btn{margin-top:auto}
.loading{text-align:center;color:var(--muted);padding:50px 0}
.loading::before{content:"";display:block;width:32px;height:32px;margin:0 auto 12px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rules{background:#fff8e6;border:1px solid #f1dfb4;border-radius:14px;padding:14px 16px;color:#5b3f00;font-size:14.5px}
.rules li{margin:3px 0}
ul.tight{margin:6px 0;padding-left:20px}ul.tight li{margin:3px 0}
/* phòng thi */
body.testing .topbar,body.testing footer,body.testing .demo-banner{display:none}
body.testing main#app{max-width:none;padding:0}
.test{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:30}
.test-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:var(--brand);color:#fff}
.tb-title{flex:1;min-width:0;line-height:1.25}
.tb-title b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title small{opacity:.8;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.timer{font-variant-numeric:tabular-nums;font-weight:700;background:rgba(255,255,255,.14);padding:7px 12px;border-radius:999px;white-space:nowrap;font-size:15px}
.timer.warn{background:var(--bad);animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.7}}
.test-bar .btn{background:var(--accent);color:#3a2500;min-height:40px}
.viol-chip{font-size:12px;background:var(--bad);border-radius:999px;padding:4px 9px;font-weight:700}
.mtabs{display:none;background:#fff;border-bottom:1px solid var(--line)}
.mtabs button{flex:1;border:0;background:none;font:inherit;font-weight:600;padding:11px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.mtabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.test-body{flex:1;min-height:0;display:flex}
.pane{min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pane.book{flex:0 0 40%;background:#fffdf8;border-right:1px solid var(--line);padding:clamp(12px,2vw,22px);padding-bottom:80px}
.pane.book img{width:100%;max-width:760px;display:block;margin:0 auto 14px;border-radius:8px;border:1px solid var(--line)}
.pane.work{flex:1;display:flex;flex-direction:column;background:#e9e4da}
.work-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px clamp(8px,2vw,24px) 90px}
@media(max-width:820px){.mtabs{display:flex}.pane.book{flex:1;border:0}.test-body>.pane:not(.on){display:none}}
.pick{max-width:860px;margin:0 auto 12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px}
.pick select{margin-top:6px}
.pick .mini{margin:6px 0 0}
/* thanh công cụ kiểu Word */
.tbar{display:flex;gap:4px;align-items:center;flex-wrap:nowrap;overflow-x:auto;background:#f8f7f4;border-bottom:1px solid var(--line);padding:6px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tbar button{flex:0 0 auto;border:1px solid transparent;background:transparent;border-radius:7px;min-width:34px;height:34px;padding:0 8px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink);white-space:nowrap}
.tbar button:hover{background:#ebe7df;border-color:var(--line)}
.tbar .sep{flex:0 0 1px;height:22px;background:var(--line);margin:0 4px}
.tbar .grp{font-size:11px;color:var(--muted);margin:0 2px 0 4px;white-space:nowrap}
.tpop{position:fixed;z-index:120;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:10px}
.tpop .gridpick{display:grid;grid-template-columns:repeat(6,22px);gap:3px}
.tpop .gridpick span{width:22px;height:22px;border:1px solid #cfc8bb;border-radius:3px;cursor:pointer}
.tpop .gridpick span.on{background:#bcd6da;border-color:var(--brand2)}
.tpop p{margin:6px 0 0;font-size:13px;text-align:center;color:var(--muted)}
/* trang giấy */
.page{max-width:860px;margin:0 auto;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.12);padding:clamp(18px,4vw,56px) clamp(16px,4.5vw,64px);font-family:'Times New Roman',Times,serif;font-size:17.3px;line-height:1.25;color:#000;min-height:70vh;outline:none;word-wrap:break-word;-webkit-user-select:text;user-select:text}
.page p{margin:0 0 4px;min-height:1.25em}
.page .c{text-align:center}
.page .b{font-weight:700}
.page .i{font-style:italic}
.page .bi{font-weight:700;font-style:italic}
.page .blue{color:#0070c0;font-weight:700}
.page .green{color:#00a050;font-weight:700}
.page .bluei{color:#0070c0;font-style:italic}
.page .greeni{color:#00a050;font-style:italic}
.page .red{color:#c00000}
.page mark{background:#ffe066;color:inherit}
.page s{color:#c00000}
.page ul,.page ol{margin:0 0 4px;padding-left:26px}
.page table{border-collapse:collapse;width:100%;margin:4px 0 8px;table-layout:fixed}
.page td,.page th{border:1px solid #000;padding:4px 7px;vertical-align:top;min-width:40px;word-wrap:break-word}
.page th{font-weight:700;text-align:center}
.page td p,.page th p{margin:0 0 2px}
.page.ro{min-height:0}
.page.ed:focus{box-shadow:0 0 0 3px rgba(29,111,128,.3),0 2px 14px rgba(0,0,0,.12)}
.page td.cur,.page th.cur{background:#f2f8f9}
.wc{max-width:860px;margin:8px auto 0;text-align:right;color:var(--muted);font-size:12.5px}
/* kết quả */
.score-big{display:flex;align-items:baseline;gap:6px;font-weight:800;font-size:48px;color:var(--ai);line-height:1}
.score-big small{font-size:20px;color:var(--muted);font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700;background:var(--soft);color:var(--brand)}
.pill.ai{background:var(--aibg);color:var(--ai)}
.pill.gv{background:var(--okbg);color:var(--ok)}
.pill.warn{background:var(--badbg);color:var(--bad)}
.review{margin-top:18px}
.review.ai{border-top:5px solid #7a5cc4}
.review.gv{border-top:5px solid var(--ok)}
table.ai-tbl{border-collapse:collapse;width:100%;font-size:14.5px;margin:8px 0}
table.ai-tbl th,table.ai-tbl td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
table.ai-tbl th{width:30%;font-weight:600}
table.ai-tbl td.sc{font-weight:800;white-space:nowrap;color:var(--ai);width:80px}
.ai-fix div{padding:8px 11px;border-radius:9px;background:#fffdf8;border:1px solid var(--line);margin:6px 0;font-size:15px}
.ai-fix s{color:var(--bad)}.ai-fix b{color:var(--ok)}.ai-fix small{display:block;color:var(--muted)}
.ai-fix em{font-style:normal;font-size:12px;font-weight:700;color:var(--brand2);text-transform:uppercase;letter-spacing:.4px}
pre.plain{white-space:pre-wrap;font-family:'Times New Roman',Times,serif;font-size:16.5px;background:#fffdf8;border:1px solid var(--line);border-radius:12px;padding:14px;margin:8px 0;line-height:1.45}
.diff{white-space:pre-wrap;font-family:'Times New Roman',Times,serif;font-size:16px;background:#fffdf8;border-radius:12px;padding:12px 14px;border:1px solid var(--line);line-height:1.5;max-height:70vh;overflow:auto}
.diff del{background:var(--badbg);color:var(--bad);text-decoration:line-through}
.diff ins{background:var(--okbg);color:var(--ok);text-decoration:none;font-weight:600}
.mini{font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;flex-wrap:wrap;margin:6px 0 10px}
.seg button{border:0;background:none;font:inherit;font-weight:600;font-size:14px;padding:7px 12px;border-radius:9px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--brand);color:#fff}
.subs{display:grid;gap:12px}
.sub-item{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
/* giáo viên */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px}
.toolbar input,.toolbar select{margin:0;flex:1;min-width:150px}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff;max-height:70vh}
table.res{border-collapse:collapse;width:100%;font-size:14px}
table.res th,table.res td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.res th{background:var(--soft);position:sticky;top:0}
table.res tr.click{cursor:pointer}table.res tr.click:hover td{background:#f7fbfb}
.adm-grid{display:grid;gap:18px}
@media(min-width:1050px){.adm-grid{grid-template-columns:1.45fr 1fr;align-items:start}}
.edwrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#e9e4da}
.edwrap .work-scroll{padding:14px 10px 30px;max-height:78vh}
.modal-bg{position:fixed;inset:0;background:rgba(20,35,43,.5);display:grid;place-items:center;z-index:100;padding:16px}
.modal{max-width:460px;width:100%}
.modal p{color:var(--muted)}
.modal.warn{border-top:6px solid var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(40px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw;text-align:center}
.overlay{position:fixed;inset:0;background:rgba(246,242,235,.92);display:grid;place-items:center;z-index:150;padding:20px;text-align:center}
body.testing{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
</style>
</head>
<body>
<div class="demo-banner hidden" id="demoBanner">Chế độ dùng thử: bài làm chỉ lưu trên máy này, chưa chấm AI. Giáo viên dán link Apps Script vào <code>API_URL</code> để chạy thật.</div>
<header class="topbar">
  <a class="logo" href="#" id="homeLink"><span class="logo-mark">KEN</span><span>Lesson Planning · ICT in ELT</span></a>
  <div class="spacer"></div>
  <button class="who hidden" id="whoBtn" title="Đổi thông tin"><span id="whoName"></span> ✎</button>
</header>
<main id="app"></main>
<footer>© KEN CLASSES · Soạn giáo án (KHBD CV 5512 – NLS – NL AI) với một hoạt động ứng dụng ICT in ELT · <button id="myLink">Kết quả của tôi</button> · <button id="adminLink">Khu vực giáo viên</button></footer>

<script>
/* ================= CẤU HÌNH ================= */
var CONFIG = {
  API_URL: '',                 // dán link Web App (…/exec) của Apps Script vào đây; để trống = chế độ dùng thử
  SCHOOLS: ['Ngoại Ngữ – ĐHTN', 'KEN CLASSES', 'VÕ NGUYÊN GIÁP', 'Lớp luyện tập'],
  TIME_MIN: 60,                // thời gian làm bài (phút)
  MAX_VIOLATIONS: 5,           // số lần rời tab/chia màn hình thì tự nộp (0 = chỉ ghi nhận)
  MAX_SCORE: 10,
  DEMO_PASSWORD: 'ken2026'
};

/* ================= ĐỀ BÀI =================
   Khung giáo án theo KHBD mẫu (Unit 2 – Tiếng Anh 10): I. OBJECTIVES – II. TEACHING AIDS – III. PROCEDURES.
   Ở B. NEW LESSON, SV chỉ soạn MỘT hoạt động (tự chọn) có ứng dụng ICT in ELT. */
var TESTS = [
  {
    id: 'U2-WRITING', code: 'Đề 1', cls: 'c1',
    unit: 'UNIT 2: THE GENERATION GAP',
    period: 'Period 15. Lesson 6. Writing – An opinion essay about limiting teenagers’ screen time',
    short: 'Lesson 6 – Writing: An opinion essay about limiting teenagers’ screen time',
    book: 'Tiếng Anh 11 Global Success – Unit 2, trang 24',
    imgs: ['img/u2-writing-p24.jpg'],
    know: ['Vocabulary:'],
    ling: ['Writing skills:'],
    acts: [
      '1. Warm-up (5’)',
      'A. Activity 1: Pre-writing – Task 1: Complete the notes (A–D)',
      'B. Activity 2: While-writing – Task 2: Read the model essay and match the paragraphs',
      'C. Activity 3: While-writing – Task 3: Write an opinion essay stating the opposite view',
      'D. Activity 4: Post-writing – Peer review / feedback on the essays'
    ]
  },
  {
    id: 'U2-CLIL', code: 'Đề 2', cls: 'c2',
    unit: 'UNIT 2: THE GENERATION GAP',
    period: 'Period 16. Lesson 7. Communication and Culture/ CLIL',
    short: 'Lesson 7 – Communication and Culture/ CLIL: Asking for and giving permission · The generation gap in Asian American families',
    book: 'Tiếng Anh 11 Global Success – Unit 2, trang 25–26',
    imgs: ['img/u2-clil-p25.jpg', 'img/u2-clil-p26.jpg'],
    know: ['Everyday English:', 'Culture/ CLIL:'],
    ling: ['Speaking skills:', 'Reading skills:'],
    acts: [
      '1. Warm-up (5’)',
      'A. Activity 1: Everyday English – Task 1: Listen and complete the conversation',
      'B. Activity 2: Everyday English – Task 2: Make similar conversations',
      'C. Activity 3: Culture – Task 1: Read the text and complete the notes',
      'D. Activity 4: Culture – Task 2: Group discussion'
    ]
  }
];
function testById(id) { return TESTS.filter(function (t) { return t.id === id; })[0]; }
var T2_HEAD = '<tr><th><p>TEACHER’S AND STUDENTS’ ACTIVITIES</p></th><th><p>CONTENTS AND EXPECTED PRODUCTS</p></th></tr>';
function tbl2() { return '<table class="t2"><tbody>' + T2_HEAD + '<tr><td><p><br></p></td><td><p><br></p></td></tr></tbody></table>'; }
function actBlock(title) {
  return '<p class="b" data-act="1">' + esc(title) + '</p><p>- Aim(s):&nbsp;</p><p>- Content(s):&nbsp;</p><p>- Expected products:&nbsp;</p><p>- Teaching steps:</p>' + tbl2();
}
function templateHtml(t, act) {
  var P = function (cls, s) { return '<p' + (cls ? ' class="' + cls + '"' : '') + '>' + s + '</p>'; };
  return P('c b', esc(t.unit)) + P('c b', esc(t.period)) +
    P('b', 'I. OBJECTIVES:') + P('i', 'By the end of this lesson, Ss will be able to:') +
    P('b', '1. Knowledge:') + t.know.map(function (k) { return P('bi', esc(k)) + P('', '-&nbsp;'); }).join('') +
    P('b', '2. Competences:') + P('b', '2.1. General competences:') + P('', '-&nbsp;') +
    P('b', '2.2. Linguistic competences:') + t.ling.map(function (k) { return P('bi', esc(k)) + P('', '-&nbsp;'); }).join('') +
    P('blue', '2.3. Digital competences:') + P('bluei', '- Relevant indicators:&nbsp;') + P('', '+&nbsp;') +
    P('green', '2.4. AI competences:') + P('greeni', '- Relevant indicators (YCCĐ NL AI):&nbsp;') + P('', '+&nbsp;') +
    P('b', '3. Attitudes:') + P('', '-&nbsp;') +
    P('b', 'II. TEACHING AIDS:') + P('', '- Teacher:&nbsp;') + P('', '- Students:&nbsp;') + P('', '- [NLS] Digital tools:&nbsp;') + P('', '- Teaching methods:&nbsp;') +
    P('b', 'III. PROCEDURES:') + P('b', 'A. ORGANIZATION:') + P('', '- Set up the class') + P('', '- Check the Ss’ attendances') +
    '<table><tbody><tr><th><p>Class</p></th><th><p>Absent student(s)</p></th><th><p>Date of teaching</p></th><th><p>Notes</p></th></tr><tr><td><p><br></p></td><td><p><br></p></td><td><p><br></p></td><td><p><br></p></td></tr></tbody></table>' +
    P('b', 'B. NEW LESSON:') +
    actBlock(act || '…………………………… (…’)') + P('', '<br>');

/* ================= TIỆN ÍCH ================= */

var KEEP = { P: 'p', DIV: 'p', H1: 'p', H2: 'p', H3: 'p', H4: 'p', BR: 'br', B: 'b', STRONG: 'b', I: 'i', EM: 'i', U: 'u', S: 's', STRIKE: 's', DEL: 's', UL: 'ul', OL: 'ol', LI: 'li', TABLE: 'table', TBODY: 'tbody', THEAD: 'tbody', TFOOT: 'tbody', TR: 'tr', TD: 'td', TH: 'th', MARK: 'mark', SPAN: 'span', FONT: 'span' };

  var lines = [];

    var parts = []; Array.prototype.forEach.call(c.childNodes, function (k) {
      if (k.nodeType === 1 && /^(UL|OL)$/.test(k.tagName)) Array.prototype.forEach.call(k.children, function (li) { parts.push('- ' + inline(li)); });
      else { var t = k.nodeType === 3 ? k.nodeValue.trim() : inline(k); if (t) parts.push(t); }
    });

  };
  (function walk(node) {
    Array.prototype.forEach.call(node.childNodes, function (n) {
      if (n.nodeType === 3) { var t = n.nodeValue.replace(/ /g, ' ').trim(); if (t) lines.push(t); return; }
      if (n.nodeType !== 1) return;
      if (n.tagName === 'TABLE') { Array.prototype.forEach.call(n.querySelectorAll('tr'), function (tr) { lines.push('[ROW] ' + Array.prototype.map.call(tr.children, cellText).join(' || ')); }); return; }

}

function blockEv(e) { if (document.body.classList.contains('testing')) e.preventDefault(); }
function leftSec() { return Math.max(0, Math.round((sess.start + CONFIG.TIME_MIN * 60000 - Date.now()) / 1000)); }
function tick() {
  var el = document.getElementById('timer'); if (!el || !sess) return;
  var s = leftSec(); el.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  el.classList.toggle('warn', s <= 300);
  if (s === 600 && !sess.w10) { sess.w10 = 1; toast('Còn 10 phút!'); }
  if (s === 300 && !sess.w5) { sess.w5 = 1; toast('Còn 5 phút!'); }
  if (s <= 0) doSubmit(true, 'Hết giờ – bài tự nộp.');

/* ---- giám sát ---- */
function goFull() {
  var d = document.documentElement, f = d.requestFullscreen || d.webkitRequestFullscreen;
  if (f && !/iPhone|iPod/.test(navigator.userAgent)) { try { var p = f.call(d); if (p && p.then) p.then(function () { mon.full = true; }).catch(function () {}); else mon.full = true; } catch (e) {} }
}
function isTyping() { var a = document.activeElement; return !!a && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.isContentEditable); }
function isSplit() {
  if (/iPhone|iPod/.test(navigator.userAgent)) return false;
  if (window.visualViewport && visualViewport.scale > 1.05) return mon.split;
  if (isTyping()) return mon.split;
  var land = window.matchMedia && matchMedia('(orientation: landscape)').matches;
  var sw = land ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
  var w = document.documentElement.clientWidth || window.innerWidth;
  return sw > 0 && w / sw < 0.62;
}
function onVis() { if (document.hidden) violation('Rời trang / chuyển tab'); }
function onBlur() { if (/iPhone|iPad|iPod|Android/.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.userAgent))) return;
  setTimeout(function () { if (mon.on && !document.hidden && !document.hasFocus()) violation('Chuyển sang cửa sổ / ứng dụng khác'); }, 400); }
function onFs() {
  var fe = document.fullscreenElement || document.webkitFullscreenElement;
  if (fe) { mon.full = true; return; }
  if (mon.full && mon.on) { mon.full = false; violation('Thoát chế độ toàn màn hình'); }
}
function checkSplit() { var s = isSplit(); if (s && !mon.split) violation('Chia đôi / thu nhỏ màn hình'); mon.split = s; }
function monitor(on) {
  if (on === mon.on) return;
  mon.on = on;
  var f = on ? 'addEventListener' : 'removeEventListener';
  document[f]('visibilitychange', onVis); window[f]('blur', onBlur); window[f]('resize', checkSplit);
  document[f]('fullscreenchange', onFs); document[f]('webkitfullscreenchange', onFs);
  clearInterval(mon.iv);
  if (on) { mon.split = isSplit(); if (mon.split) setTimeout(function () { violation('Chia đôi / thu nhỏ màn hình'); }, 800); mon.iv = setInterval(checkSplit, 3000); showViol(); }
  else if (document.fullscreenElement && document.exitFullscreen) { mon.full = false; document.exitFullscreen().catch(function () {}); }
}
function violation(kind) {
  if (!mon.on || !sess || submitting) return;
  var now = Date.now(); if (now - mon.last < 2000) return; mon.last = now;
  sess.viol = sess.viol || [];
  sess.viol.push({ k: kind, t: Math.round((now - sess.start) / 1000) });
  LS.set(sessKey(), sess); showViol();
  var n = sess.viol.length, max = CONFIG.MAX_VIOLATIONS;
  if (max && n >= max) { doSubmit(true, 'Vi phạm quy chế ' + n + ' lần – bài tự nộp.'); return; }
  modal('⚠️ Cảnh báo vi phạm (' + n + (max ? '/' + max : '') + ')', '<b>' + esc(kind) + '</b><br>Lần vi phạm đã được ghi lại và gửi cho giáo viên.' + (max ? ' Đến lần thứ ' + max + ' bài sẽ tự nộp.' : ''), 'Quay lại làm bài', false, 'warn').then(goFull);
}
function showViol() { var c = document.getElementById('violChip'); if (!c) return; var n = (sess.viol || []).length; c.classList.toggle('hidden', !n); c.textContent = '⚠ ' + n; }
/* ---- nộp bài ---- */
function doSubmit(auto, reason) {
  if (submitting) return;
  var page = document.getElementById('page'); if (page) sess.html = page.innerHTML;
  var p = auto ? Promise.resolve(true) : modal('Nộp bài?', (sess.act ? '' : '⚠️ Bạn chưa chọn hoạt động ở ô phía trên giáo án. ') + 'Còn ' + Math.ceil(leftSec() / 60) + ' phút. Nộp bài ngay?', 'Nộp bài', 'Làm tiếp');
  p.then(function (ok) {
    if (!ok) return;
    submitting = true; clearInterval(timerId); monitor(false);
    var dur = Math.min(CONFIG.TIME_MIN * 60, Math.round((Date.now() - sess.start) / 1000));
    overlay(true, (reason ? reason + ' ' : '') + 'Đang nộp bài và chấm bằng AI – Claude + OpenAI (khoảng 30–90 giây)…');
    var html = clean(sess.html);
    var payload = { testId: current.id, title: current.code + ' · ' + current.short, activity: sess.act || '', student: student, html: html, text: htmlToText(html), duration: dur, viol: sess.viol || [], auto: !!auto };
    var send = function (tries) {
      return api('submit', payload).catch(function (e) { if (tries > 0) return new Promise(function (r) { setTimeout(r, 2500); }).then(function () { return send(tries - 1); }); throw e; });
    };
    send(2).then(function (r) {
      overlay(false); LS.del(sessKey()); LS.set('obj_done_' + current.id + '_' + student.sid, new Date().toISOString());
      setTesting(false); renderResult(r, true);
    }).catch(function (e) {
      overlay(false); submitting = false;
      modal('Chưa nộp được bài', esc(e.message) + '<br>Bài làm vẫn được lưu trên máy. Kiểm tra mạng rồi bấm Thử lại.', 'Thử lại', false).then(function () { doSubmit(true); });
    });
  });
}

/* ---- so sánh: theo dòng, rồi theo từ trong dòng bị sửa ---- */
function lcs(A, B) {
  var n = A.length, m = B.length, dp = [];
  for (var i = 0; i <= n; i++) dp.push(new Int32Array(m + 1));
  for (i = n - 1; i >= 0; i--) for (var j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  var ops = []; i = 0; j = 0;
  while (i < n && j < m) { if (A[i] === B[j]) { ops.push(['=', A[i]]); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) ops.push(['-', A[i++]]); else ops.push(['+', B[j++]]); }
  while (i < n) ops.push(['-', A[i++]]); while (j < m) ops.push(['+', B[j++]]);
  return ops;
}
function diffWords(a, b) {
  var A = a.split(/(\s+)/), B = b.split(/(\s+)/);
  if (A.length * B.length > 250000) return '<del>' + esc(a) + '</del>\n<ins>' + esc(b) + '</ins>';
  var out = '', del = '', ins = '';
  var flush = function () { if (del) out += /\S/.test(del) ? '<del>' + esc(del) + '</del>' : esc(del); if (ins) out += /\S/.test(ins) ? '<ins>' + esc(ins) + '</ins>' : esc(ins); del = ins = ''; };
  lcs(A, B).forEach(function (o) { if (o[0] === '=') { flush(); out += esc(o[1]); } else if (o[0] === '-') del += o[1]; else ins += o[1]; });
  flush(); return out;
}
function diffText(a, b) {
  var ops = lcs(String(a || '').split('\n'), String(b || '').split('\n')), out = [], k = 0;
  while (k < ops.length) {
    if (ops[k][0] === '=') { out.push(esc(ops[k][1])); k++; continue; }
    var dels = [], adds = [];
    while (k < ops.length && ops[k][0] !== '=') { (ops[k][0] === '-' ? dels : adds).push(ops[k][1]); k++; }
    var n = Math.max(dels.length, adds.length);
    for (var i = 0; i < n; i++) {
      if (dels[i] != null && adds[i] != null) out.push(diffWords(dels[i], adds[i]));
      else if (dels[i] != null) out.push('<del>' + esc(dels[i]) + '</del>');
      else out.push('<ins>' + esc(adds[i]) + '</ins>');
    }
  }
  return out.join('\n');
}

function exportCsv() {
  var list = filteredSubs(), head = ['Thời gian', 'Họ tên', 'Mã SV', 'Trường', 'Lớp', 'Đề', 'Hoạt động', 'Phút', 'Số lần vi phạm', 'Điểm AI', 'Claude', 'OpenAI', 'Điểm GV', 'Điểm cuối', 'Nhận xét GV'];
  var q = function (v) { v = String(v == null ? '' : v); return '"' + v.replace(/"/g, '""') + '"'; };
  var rows = list.map(function (s) {
    var e = (s.ai && s.ai.engines) || {};
    return [fmtTime(s.time), s.student.name, s.student.sid, s.student.school, s.student.cls, (testById(s.testId) || {}).code || s.testId, s.activity, Math.round((s.duration || 0) / 60), (s.viol || []).length,
      s.ai ? s.ai.score : '', e.claude != null ? e.claude : '', e.openai != null ? e.openai : '', s.teacher ? s.teacher.score : '', finalScore(s), s.teacher ? s.teacher.comment : ''].map(q).join(',');
  });
  var blob = new Blob(['﻿' + [head.map(q).join(',')].concat(rows).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'KEN Lesson Planning ICT - Ket qua - ' + new Date().toLocaleDateString('vi-VN').replace(/\//g, '.') + '.csv'; a.click();
}
