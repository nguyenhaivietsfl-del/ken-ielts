<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KEN FRANÇAIS – 3333 từ vựng tiếng Pháp theo chủ đề</title>
<meta name="theme-color" content="#1f3a8a">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2433;--muted:#667085;--line:#e3e8f0;--pri:#1f3a8a;--pri2:#2f5fd0;--red:#d6303c;--ok:#1a9e5c;--okbg:#e6f6ee;--bad:#d64545;--badbg:#fdecec;
--A1:#22a06b;--A2:#2f5fd0;--B1:#8f5cf6;--WC:#d6303c;--r:16px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#1f3a8a 0 60%,#2a4aa8);color:#fff;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;border-bottom:4px solid;border-image:linear-gradient(90deg,#1f3a8a 33%,#fff 33% 66%,#d6303c 66%) 1}
header.top .brand{font-weight:800;letter-spacing:.3px;cursor:pointer;white-space:nowrap}
header.top .brand small{font-weight:500;opacity:.85;margin-left:6px}
header.top .sp{flex:1}
header.top .who{font-size:13px;opacity:.92;text-align:right;line-height:1.25;max-width:45vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top .ib{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;padding:6px 10px;cursor:pointer}
main{max-width:1000px;margin:0 auto;padding:16px 14px 80px}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 2px rgba(16,24,40,.06),0 1px 8px rgba(16,24,40,.04);padding:18px;margin-bottom:14px}
h1,h2,h3{margin:0 0 8px;line-height:1.25}h1{font-size:24px}h2{font-size:20px}h3{font-size:17px}
.muted{color:var(--muted)}.small{font-size:13px}.center{text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600;min-height:44px;color:var(--ink)}
.btn.pri{background:var(--pri2);border-color:var(--pri2);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent}.btn.sm{min-height:34px;padding:6px 12px;font-size:14px;border-radius:10px}.btn.big{width:100%;font-size:17px;min-height:52px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:block;margin:10px 0 4px;font-weight:600;font-size:14px}
input.in,select.in,textarea.in{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:16px}
input.in:focus,textarea.in:focus,select.in:focus{outline:none;border-color:var(--pri2);box-shadow:0 0 0 3px rgba(47,95,208,.15)}
.err{color:var(--bad);font-size:14px;min-height:20px}
.goal{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),#e8edf4 0);display:grid;place-items:center;flex:none}
.ring>div{width:94px;height:94px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring b{font-size:26px}.ring span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(80px,1fr));gap:10px;flex:1;min-width:240px}
.stat{background:var(--bg);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}
.tag{display:inline-block;background:var(--c);color:#fff;border-radius:8px;padding:2px 10px;font-weight:800;font-size:14px}
.bar{height:10px;background:#e8edf4;border-radius:6px;overflow:hidden;margin:8px 0 6px}.bar>i{display:block;height:100%;background:var(--c,var(--ok));border-radius:6px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:14px;height:14px;border-radius:3px;background:#e8edf4}.heat i.l1{background:#b7e4c7}.heat i.l2{background:#74c69d}.heat i.l3{background:#2d9d63}.heat i.l4{background:#1b6e44}.heat i.today{outline:2px solid var(--pri2)}
.legend{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:700}.tabs button.on{background:var(--c);border-color:var(--c);color:#fff}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tp{border:1.5px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:10px 12px;cursor:pointer;background:#fff;text-align:left;display:flex;flex-direction:column;gap:2px}
.tp.done{background:var(--okbg);border-color:var(--ok);border-left-color:var(--ok)}.tp.cur{box-shadow:0 0 0 3px rgba(47,95,208,.25)}
.tp .n{font-size:12px;color:var(--muted);font-weight:700}.tp b{font-size:15px}.tp small{color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--bg);color:var(--muted)}
.fc{min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.fc .w{font-size:36px;font-weight:800;color:var(--pri)}.fc .ipa{color:var(--muted);font-size:18px}.fc .vi{font-size:20px;font-weight:600}
.fc .ex{background:var(--bg);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:17px}.fc .ex b{color:var(--red)}.fc .ex .t{color:var(--muted);font-size:15px;margin-top:4px}
.say{border:0;background:var(--bg);border-radius:999px;width:40px;height:40px;cursor:pointer;font-size:18px}
.g-m{color:#2f5fd0}.g-f{color:#d6303c}
.exhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.steps{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 2px}.steps i{width:26px;height:8px;border-radius:4px;background:#e8edf4}.steps i.d{background:var(--ok)}.steps i.c{background:var(--pri2)}
.qbar{height:6px;background:#e8edf4;border-radius:4px;overflow:hidden;margin:10px 0 14px}.qbar>i{display:block;height:100%;background:var(--pri2)}
.q{font-size:20px;font-weight:700;margin:6px 0 4px}.q .big{font-size:30px;color:var(--pri)}
.sent{font-size:19px;background:var(--bg);border-radius:12px;padding:14px;margin:8px 0}.sent .gap{display:inline-block;min-width:90px;border-bottom:2.5px solid var(--pri2);text-align:center}.sent b{color:var(--red)}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;font-size:17px;min-height:50px}
.opt:hover{border-color:var(--pri2)}.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{border-radius:12px;padding:12px 14px;margin-top:12px}.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}
.fb .t{font-weight:800}.fb.ok .t{color:var(--ok)}.fb.no .t{color:var(--bad)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.tile{min-width:42px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:20px;font-weight:700;cursor:pointer}.tile.used{visibility:hidden}
.acc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.acc button{border:1px solid var(--line);background:#fff;border-radius:8px;min-width:36px;height:36px;cursor:pointer;font-size:17px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}.match .col{display:grid;gap:8px}
.mt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px;min-height:52px;cursor:pointer;font-size:16px;text-align:center}
.mt.sel{border-color:var(--pri2);box-shadow:0 0 0 3px rgba(47,95,208,.2)}.mt.done{border-color:var(--ok);background:var(--okbg);opacity:.6;cursor:default}.mt.shake{animation:sh .35s;border-color:var(--bad);background:var(--badbg)}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.score{font-size:54px;font-weight:900;line-height:1}.score.ok{color:var(--ok)}.score.no{color:var(--bad)}
table.t{width:100%;border-collapse:collapse;font-size:15px}table.t td,table.t th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.timer{font-variant-numeric:tabular-nums;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{max-width:460px;width:100%;max-height:90vh;overflow:auto}
.hint{font-size:14px;color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600}.seg button.on{border-color:var(--pri2);background:#eaf0fd;color:var(--pri)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c2433;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:15px}
@media (max-width:560px){h1{font-size:21px}.fc .w{font-size:30px}.q .big{font-size:26px}main{padding:12px 10px 80px}.card{padding:14px}}
@media (max-width:430px){.brand small{display:none}}
</style>
</head>
<body>
<header class="top"><div class="brand" id="home">🇫🇷 KEN FRANÇAIS<small>3333 từ · 101 chủ đề</small></div><div class="sp"></div><div class="who" id="who"></div><a class="ib" href="../giaovien/?app=french" title="Khu vực giáo viên" style="text-decoration:none">👩‍🏫</a><button class="ib" id="menuBtn" title="Cài đặt">⚙️</button></header>
<main id="app"><div class="card center muted">Đang tải dữ liệu…</div></main>
<script src="../shared/ken-config.js"></script>
<script src="data/words.js"></script>
<script>
'use strict';
var CONFIG = { PASS: 80, GOALS: [1, 2, 3, 4], SCHOOLS: ['Ngoại Ngữ – ĐHTN', 'KEN CLASSES', 'VÕ NGUYÊN GIÁP', 'Lớp luyện tập'] };
var GROUPS = ['A1', 'A2', 'B1', 'WC'];
var GNAME = { A1: 'A1 – Cơ bản', A2: 'A2 – Sơ cấp', B1: 'B1 – Trung cấp', WC: 'Từ loại thông dụng', ALL: 'Tổng hợp tất cả' };
var SRS = [0, 1, 2, 4, 7, 15, 30, 60];

/* ===== DỮ LIỆU ===== */
var TOPICS = (window.FR && FR.topics) || [];
var W = ((window.FR && FR.words) || []).map(function (r) { return { n: r[0], w: r[1], ipa: r[2], pos: r[3], vi: r[4], ex: r[5], exvi: r[6], form: r[7], t: r[8] }; });
var BYN = {}; W.forEach(function (o) { BYN[o.n] = o; o.grp = TOPICS[o.t].grp; });

/* ===== TIỆN ÍCH ===== */
var app = document.getElementById('app');
function $(s, r) { return (r || document).querySelector(s); }
function hintW(a) { return String(a).split(/(\s+)/).map(function (t) { return /^\s+$/.test(t) ? '&nbsp;&nbsp;&nbsp;' : '<b>' + esc(t.charAt(0)) + '</b>' + esc(t.slice(1).replace(/[^'’-]/g, ' _')); }).join(''); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pick(a, k) { return shuffle(a).slice(0, k); }
function today(d) { d = d || new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function addDays(s, k) { var p = s.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]); d.setDate(d.getDate() + k); return today(d); }
function norm(s) { return String(s || '').toLowerCase().replace(/[’‘`]/g, "'").replace(/[.!?;:,]+$/, '').replace(/\s+/g, ' ').trim(); }
function noacc(s) { return norm(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/œ/g, 'oe').replace(/æ/g, 'ae'); }
function headAnswers(o) { var h = o.w.replace(/\(.*?\)/g, '').trim(); return h.split('/').map(function (x) { return x.trim(); }).filter(Boolean); }
function sentHTML(o, mode) {
  var ex = esc(o.ex);
  if (!o.form) return ex;
  var f = esc(o.form), i = ex.indexOf(f);
  if (i < 0) return ex;
  return ex.slice(0, i) + (mode === 'gap' ? '<span class="gap">&nbsp;</span>' : '<b>' + f + '</b>') + ex.slice(i + f.length);
}
function gender(o) { return /^n\.m\./.test(o.pos) && o.pos.indexOf('/') < 0 ? 'm' : /^n\.f\./.test(o.pos) ? 'f' : ''; }
function wordHTML(o) { var g = gender(o); return '<span class="' + (g ? 'g-' + g : '') + '">' + esc(o.w) + '</span>'; }
function LSget(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function LSset(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function toast(msg) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2200); }
function modal(title, html, okText, cancelText) {
  return new Promise(function (res) {
    var m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = '<div class="card"><h2>' + title + '</h2><div style="margin:8px 0 16px">' + html + '</div><div class="row" style="justify-content:flex-end">' + (cancelText ? '<button class="btn" data-v="0">' + cancelText + '</button>' : '') + '<button class="btn pri" data-v="1">' + (okText || 'OK') + '</button></div></div>';
    m.onclick = function (e) { var b = e.target.closest('[data-v]'); if (!b) return; m.remove(); res(b.getAttribute('data-v') === '1'); };
    document.body.appendChild(m);
  });
}

/* ===== PHÁT ÂM TIẾNG PHÁP ===== */
var voice = null;
function pickVoice() { if (!window.speechSynthesis) return; var vs = speechSynthesis.getVoices(); voice = vs.filter(function (v) { return /fr-FR/i.test(v.lang); })[0] || vs.filter(function (v) { return /^fr/i.test(v.lang); })[0] || null; }
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, rate) {
  if (!window.speechSynthesis) { toast('Trình duyệt không hỗ trợ đọc phát âm'); return; }
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(String(text).replace(/\(.*?\)/g, '').replace(/\//g, ', '));
  u.lang = voice ? voice.lang : 'fr-FR'; if (voice) u.voice = voice; u.rate = rate || (S && S.data.rate) || 0.85;
  speechSynthesis.speak(u);
}

/* ===== HỌC VIÊN & TIẾN ĐỘ ===== */
var student = LSget('kf_student', null), S = null;
function loadState() {
  var key = 'kf_' + (student.sid || 'guest').toLowerCase();
  var d = LSget(key, null) || { goal: 2, rate: 0.85, topics: {}, words: {}, days: {}, lesson: null, writings: [] };
  S = { key: key, data: d, save: function () { LSset(key, d); } };
}
function day(k) { k = k || today(); var d = S.data.days[k]; if (!d) d = S.data.days[k] = { tp: 0, learned: 0, q: 0, ok: 0, rev: 0 }; return d; }
function learnedCount(g) { var c = 0; for (var k in S.data.words) if (!g || (BYN[k] && BYN[k].grp === g)) c++; return c; }
function dueWords() { var t = today(), out = []; for (var k in S.data.words) if (S.data.words[k].due <= t) out.push(+k); return out; }
function streak() {
  var t = today(), c = 0, k = t, g = S.data.goal;
  if (!(S.data.days[k] && S.data.days[k].tp >= g)) k = addDays(t, -1);
  while (S.data.days[k] && S.data.days[k].tp >= g) { c++; k = addDays(k, -1); }
  return c;
}
function recordAnswer(n, ok) { var d = day(); d.q++; if (ok) d.ok++; var w = S.data.words[n]; if (w) { if (ok) w.r = (w.r || 0) + 1; else w.x = (w.x || 0) + 1; } }
function updateWho() { $('#who').innerHTML = student ? esc(student.name) + '<br><span style="opacity:.85">' + esc(student.cls) + ' · 🔥 ' + streak() + ' ngày</span>' : ''; }
function topicDone(i) { return (S.data.topics[i] || {}).passed; }
function nextTopic(g) { for (var i = 0; i < TOPICS.length; i++) if ((!g || TOPICS[i].grp === g) && !topicDone(i)) return i; return -1; }
function topicLabel(t) { return (t.num ? String(t.num).padStart(2, '0') + ' · ' : '') + t.name; }

/* ===== ĐĂNG NHẬP ===== */
function renderLogin() {
  var st = student || {};
  app.innerHTML = '<div class="card" style="max-width:520px;margin:4vh auto"><h1>Bonjour ! 👋</h1><p class="muted">Học <b>3333 từ vựng tiếng Pháp</b> theo <b>101 chủ đề</b> (A1 → B1) và các từ loại thông dụng. Mục tiêu mỗi ngày: <b>2 chủ đề</b>. Mỗi chủ đề có 10 bài tập, mỗi bài tập phải đạt từ <b>' + CONFIG.PASS + '%</b> trở lên.</p>' +
    '<form id="lf"><label class="f">Họ và tên</label><input class="in" name="name" required value="' + esc(st.name || '') + '">' +
    '<label class="f">Mã SV/HS</label><input class="in" name="sid" required value="' + esc(st.sid || '') + '">' +
    '<label class="f">Trường</label><select class="in" name="school">' + CONFIG.SCHOOLS.concat(['Khác']).map(function (s) { return '<option' + (st.school === s ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select>' +
    '<input class="in" name="other" placeholder="Nhập tên trường" style="margin-top:8px;display:none" value="' + esc(CONFIG.SCHOOLS.indexOf(st.school) < 0 && st.school ? st.school : '') + '">' +
    '<label class="f">Giáo viên phụ trách</label><input class="in" name="teacher" required list="kenTeachers" placeholder="VD: Thầy Việt" value="' + esc(st.teacher || '') + '"><datalist id="kenTeachers">' + (window.KEN_TEACHERS || []).map(function (t) { return '<option value="' + esc(t) + '">'; }).join('') + '</datalist>' +
    '<label class="f">Lớp (Lớp + Khóa)</label><input class="in" name="cls" required placeholder="VD: K20 Pháp 1" value="' + esc(st.cls || '') + '">' +
    '<div class="err" id="lerr"></div><button class="btn pri big">Commencer – Bắt đầu học</button></form></div>';
  var f = $('#lf'), sel = f.school, other = f.other;
  if (st.school && CONFIG.SCHOOLS.indexOf(st.school) < 0) sel.value = 'Khác';
  function tog() { other.style.display = sel.value === 'Khác' ? 'block' : 'none'; } sel.onchange = tog; tog();
  f.onsubmit = function (e) {
    e.preventDefault();
    var s = { name: f.name.value.trim(), sid: f.sid.value.trim(), school: sel.value === 'Khác' ? other.value.trim() : sel.value, cls: f.cls.value.trim(), teacher: f.teacher.value.trim() };
    if (!s.name || !s.sid || !s.school || !s.cls || !s.teacher) { $('#lerr').textContent = 'Vui lòng điền đủ thông tin.'; return; }
    student = s; LSset('kf_student', s); loadState(); updateWho(); renderHome();
  };
}

/* ===== TRANG CHÍNH ===== */
var curTab = 'A1';
function heatmap() {
  var t = today(), cells = '', start = addDays(t, -(7 * 16 - 1)), p = start.split('-'), dow = (new Date(+p[0], +p[1] - 1, +p[2]).getDay() + 6) % 7;
  for (var i = 0; i < dow; i++) cells += '<i style="visibility:hidden"></i>';
  for (var k = start; k <= t; k = addDays(k, 1)) {
    var d = S.data.days[k], g = S.data.goal, v = d ? d.tp + (d.rev ? 0.5 : 0) : 0, cl = !d || (!d.tp && !d.rev) ? '' : d.tp >= g * 1.5 ? 'l4' : d.tp >= g ? 'l3' : d.tp >= 1 ? 'l2' : 'l1';
    cells += '<i class="' + cl + (k === t ? ' today' : '') + '" title="' + k + ': ' + (d ? d.tp + ' chủ đề, ' + d.learned + ' từ mới, ' + d.rev + ' lượt ôn' : 'chưa học') + '"></i>';
  }

        '<div><b>' + wordHTML(o) + '</b> ' + esc(o.ipa) + (o.pos ? ' (' + esc(o.pos) + ')' : '') + ': ' + esc(o.vi) + ' <button class="say" data-say="' + esc(o.w) + '">🔊</button></div><div class="small" style="margin-top:4px">' + sentHTML(o, 'bold') + '<br><span class="muted">' + esc(o.exvi) + '</span></div></div>' +

function runMatch(title, words, n, done) {
  var all = pick(words, Math.min(n, words.length)), rounds = [], right = 0, wrongs = [], total = all.length, r = 0;

  function round() {
    if (r >= rounds.length) return done(Math.round(right / total * 100), wrongs);
    var ws = rounds[r], left = shuffle(ws), rc = shuffle(ws), sel = null, missed = {}, matched = 0;
    app.innerHTML = '<div class="card">' + lessonHead(title) + '<div class="small muted" style="margin-top:6px">Lượt ' + (r + 1) + '/' + rounds.length + ' · Chạm một từ rồi chạm nghĩa tương ứng. Ghép sai lần đầu sẽ bị tính sai.</div><div class="qbar"><i style="width:' + (r / rounds.length * 100) + '%"></i></div>' +
      '<div class="match"><div class="col">' + left.map(function (o) { return '<button class="mt" data-l="' + o.n + '"><b>' + wordHTML(o) + '</b></button>'; }).join('') + '</div><div class="col">' + rc.map(function (o) { return '<button class="mt" data-r="' + o.n + '">' + esc(o.vi) + '</button>'; }).join('') + '</div></div></div>';
    bindQuit();
    app.querySelector('.match').onclick = function (e) {
      var b = e.target.closest('.mt'); if (!b || b.classList.contains('done')) return;
      if (b.dataset.l) { app.querySelectorAll('[data-l]').forEach(function (x) { x.classList.remove('sel'); }); b.classList.add('sel'); sel = b; say(BYN[b.dataset.l].w); return; }
      if (!sel) { b.classList.add('shake'); setTimeout(function () { b.classList.remove('shake'); }, 400); return; }
      var ln = sel.dataset.l, rn = b.dataset.r, ok = ln === rn || BYN[ln].vi === BYN[rn].vi;
      if (ok) { sel.classList.remove('sel'); sel.classList.add('done'); b.classList.add('done'); matched++; if (!missed[ln]) right++; sel = null; if (matched === ws.length) setTimeout(function () { r++; round(); }, 450); }
      else { b.classList.add('shake'); setTimeout(function () { b.classList.remove('shake'); }, 400); if (!missed[ln]) { missed[ln] = 1; wrongs.push(BYN[ln]); } }
    };

}

  if (!student) return;
  modal('⚙️ Cài đặt', '<label class="f">Mục tiêu mỗi ngày</label><div class="seg" id="gs">' + CONFIG.GOALS.map(function (g) { return '<button data-v="' + g + '" class="' + (S.data.goal === g ? 'on' : '') + '">' + g + ' chủ đề</button>'; }).join('') + '</div>' +
    '<label class="f">Tốc độ đọc</label><div class="seg" id="rs">' + [[0.65, 'Chậm'], [0.85, 'Vừa'], [1, 'Nhanh']].map(function (r) { return '<button data-v="' + r[0] + '" class="' + (S.data.rate === r[0] ? 'on' : '') + '">' + r[1] + '</button>'; }).join('') + '</div>' +
    '<div class="row" style="margin-top:16px"><button class="btn sm" id="chg">👤 Đổi học viên</button><button class="btn sm" id="rst" style="color:var(--bad)">Xóa tiến độ</button></div><p class="hint">Tiến độ được lưu trên trình duyệt của máy này, theo mã SV/HS.</p>', 'Xong').then(function () { renderHome(); });
  $('#gs').onclick = function (e) { var b = e.target.closest('button'); if (!b) return; S.data.goal = +b.dataset.v; S.save(); this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); }); };
  $('#rs').onclick = function (e) { var b = e.target.closest('button'); if (!b) return; S.data.rate = +b.dataset.v; S.save(); this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); }); say('Bonjour, bienvenue au cours de français.'); };
  $('#chg').onclick = function () { document.querySelector('.modal').remove(); LSset('kf_student', null); student = null; updateWho(); renderLogin(); };
  $('#rst').onclick = function () { document.querySelector('.modal').remove(); modal('Xóa toàn bộ tiến độ?', 'Không thể hoàn tác.', 'Xóa', 'Hủy').then(function (ok) { if (ok) { localStorage.removeItem(S.key); loadState(); renderHome(); } }); };
};
$('#home').onclick = function () { if (!student) return; var q = $('#quit'); if (q) q.click(); else renderHome(); };
document.addEventListener('click', function (e) { var b = e.target.closest('[data-say]'); if (b) { e.preventDefault(); say(b.dataset.say, b.dataset.rate ? +b.dataset.rate : 0); } });

if (!W.length) app.innerHTML = '<div class="card">Không tải được dữ liệu từ vựng.</div>';
else if (student) { loadState(); renderHome(); } else renderLogin();
/* ===== GIÁM SÁT: không được rời tab / chuyển ứng dụng khi đang học (chỉ cảnh báo, ghi vào báo cáo) ===== */
(function () {
  var away = false, isTouch = /iPhone|iPad|iPod|Android/.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.userAgent));
  function active() { return !!(student && S && student.sid !== '__teacher__' && document.querySelector('#quit')); }
  function typing() { var a = document.activeElement; return !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); }
  function warn(kind) {
    if (!S) return; var d = day(); d.viol = (d.viol || 0) + 1; S.data.violTotal = (S.data.violTotal || 0) + 1; S.save(); if (window.KT) KT.ev('viol', kind);
    var old = document.querySelector('.modal.vw'); if (old) old.remove();
    var m = document.createElement('div'); m.className = 'modal vw';
    m.innerHTML = '<div class="card" style="border:3px solid #d64545"><h2 style="color:#d64545">⚠️ Cảnh báo vi phạm</h2><p>Bạn vừa <b>' + kind + '</b> trong lúc đang học.</p><p>Khi đang học và làm bài, <b>không được thoát tab, chuyển sang ứng dụng khác hay mở cửa sổ khác</b>.</p><p>Số lần vi phạm hôm nay: <b style="color:#d64545">' + d.viol + '</b>. Số lần này được ghi vào báo cáo gửi giáo viên.</p><div class="row" style="justify-content:flex-end"><button class="btn pri">Tôi đã hiểu, học tiếp</button></div></div>';
    m.querySelector('button').onclick = function () { m.remove(); }; document.body.appendChild(m);
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (active()) away = true; }
    else if (away) { away = false; warn('rời khỏi trang / chuyển tab / chuyển ứng dụng'); }
  });
  window.addEventListener('blur', function () {
    if (isTouch) return;
    setTimeout(function () { if (!document.hidden && !document.hasFocus() && !typing() && active()) warn('chuyển sang cửa sổ khác'); }, 400);
  });
})();
window.KEN_SYNC = { app: 'french',
  progress: function () { return TOPICS.filter(function (t, i) { return topicDone(i); }).length + '/' + TOPICS.length + ' chủ đề · ' + learnedCount() + ' từ'; },
  level: function () { var t = nextTopic(); return t >= 0 ? 'Đang học: ' + topicLabel(TOPICS[t]) : 'Hoàn thành'; },
  todayStr: function () { var d = day(); return (d.tp || 0) + '/' + S.data.goal + ' chủ đề hôm nay'; },
  lessonTitle: function () { return topicLabel(L.topic) + ' – ' + L.topic.vi; } };
/* ===== ĐỒNG BỘ KẾT QUẢ LÊN GOOGLE SHEET → KHU VỰC GIÁO VIÊN ===== */
(function () {
  var C = window.KEN_SYNC || {}, URL = window.KEN_TRACK_URL || '', timer = null, busy = false;
  function qk() { return 'ken_sync_' + C.app + '_' + ((student && student.sid) || 'guest').toLowerCase(); }
  function getq() { try { return JSON.parse(localStorage.getItem(qk())) || []; } catch (e) { return []; } }
  function setq(a) { try { localStorage.setItem(qk(), JSON.stringify(a.slice(-400))); } catch (e) {} }
  function txt(h) { var d = document.createElement('div'); d.innerHTML = String(h == null ? '' : h); return d.textContent.replace(/\s+/g, ' ').trim(); }
  function wrongList(ws) {
    try { var d = document.createElement('div'); d.innerHTML = '<table>' + wrongTable(ws || []) + '</table>';
      return [].slice.call(d.querySelectorAll('tr')).map(function (tr) { var c = tr.querySelectorAll('td'); return c.length ? [].map.call(c, function (x) { return x.textContent.replace(/\s+/g, ' ').trim(); }).join(' → ') : ''; }).filter(Boolean).slice(0, 30);
    } catch (e) { return []; }
  }
  function snap() {
    var q7 = 0, ok7 = 0, v7 = 0, a7 = 0;
    for (var k = 6; k >= 0; k--) { var x = S.data.days[addDays(today(), -k)]; if (x) { q7 += x.q || 0; ok7 += x.ok || 0; v7 += x.viol || 0; if (x.q) a7++; } }
    var rep = ''; try { rep = reportLines().join('\n'); } catch (e) {}
    return { streak: streak(), acc7: q7 ? Math.round(ok7 / q7 * 100) : '', q7: q7, days7: a7, viol7: v7, violTotal: S.data.violTotal || 0,
      progress: C.progress ? C.progress() : '', level: C.level ? C.level() : '', today: C.todayStr ? C.todayStr() : '', report: rep };
  }
  function push() {
    if (!URL || busy || !student || !S || student.sid === '__teacher__') return;
    var a = getq(), n = Math.min(a.length, 80); busy = true;
    var body = JSON.stringify({ action: 'track', app: C.app, student: { name: student.name, sid: student.sid, cls: student.cls, school: student.school || '', teacher: student.teacher || '' }, snap: snap(), events: a.slice(0, n) });
    fetch(URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body, keepalive: body.length < 60000 })
      .then(function (r) { return r.json(); })
      .then(function (j) { busy = false; if (j && j.ok) { setq(getq().slice(n)); if (getq().length) KT.sync(500); } })
      .catch(function () { busy = false; });
  }
  var BUF = [];
  function grab() { var b = BUF; BUF = []; return b; }
  window.KT = {
    miss: function (q, given) {
      try { var corr = q.opts ? q.opts[q.ans] : (q.accept || [])[0], g = given == null || given === '' ? '(bỏ trống / hết giờ)' : (q.opts && typeof given === 'number' ? q.opts[given] : given);
        BUF.push(txt(q.prompt).slice(0, 180) + '  ✗ HS trả lời: ' + txt(g).slice(0, 80) + '  ✓ Đúng: ' + txt(corr).slice(0, 80)); if (BUF.length > 80) BUF.shift(); } catch (e) {}
    },
    ev: function (kind, title, score, extra) {
      if (!student || student.sid === '__teacher__') return; var e = extra || {};
      e.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7); e.t = new Date().toISOString(); e.kind = kind; e.title = title || ''; e.score = score == null ? '' : score;
      var a = getq(); a.push(e); setq(a); KT.sync(1200);
    },
    sync: function (ms) { clearTimeout(timer); timer = setTimeout(push, ms || 0); }
  };
  var _rp = resultPage;
  resultPage = function (title, score, wrongs) { try { var b = grab(); KT.ev('result', txt(title), score, { wrong: b.length ? b : wrongList(wrongs), nWrong: (wrongs || []).length }); } catch (e) {} return _rp.apply(this, arguments); };
  var _fl = finishLesson;
  finishLesson = function () {
    var title = '', steps = null; try { title = C.lessonTitle ? C.lessonTitle() : ''; steps = L && L.scores ? JSON.parse(JSON.stringify(L.scores)) : null; } catch (e) {}
    var r = _fl.apply(this, arguments);
    try { var m = app.innerHTML.match(/Điểm trung bình[^<]*<b>(\d+)%/); var b = grab(); KT.ev('lesson', title, m ? +m[1] : '', { steps: steps, wrong: b, nWrong: b.length }); } catch (e) {}
    return r;
  };
  var _rh = renderHome;
  renderHome = function () { BUF = []; var r = _rh.apply(this, arguments); KT.sync(1500); askTeacher(); return r; };
  function askTeacher() {
    if (!student || student.teacher || student.sid === '__teacher__' || document.querySelector('.modal.tch')) return;
    var m = document.createElement('div'); m.className = 'modal tch';
    m.innerHTML = '<div class="card"><h2>👩‍🏫 Giáo viên phụ trách</h2><p>Em nhập tên giáo viên đang dạy em (để thầy cô theo dõi được kết quả học nhé).</p><input class="in" id="tchIn" list="kenTeachers2" placeholder="VD: Thầy Việt"><datalist id="kenTeachers2">' + (window.KEN_TEACHERS || []).map(function (t) { return '<option value="' + esc(t) + '">'; }).join('') + '</datalist><div class="err" id="tchErr"></div><div class="row" style="margin-top:10px"><button class="btn pri" id="tchOk">Lưu</button></div></div>';
    document.body.appendChild(m);
    m.querySelector('#tchOk').onclick = function () { var v = m.querySelector('#tchIn').value.trim(); if (!v) { m.querySelector('#tchErr').textContent = 'Vui lòng nhập tên giáo viên.'; return; } student.teacher = v; LSset('kf_student', student); m.remove(); KT.sync(300); };
  }
  setTimeout(askTeacher, 800);
  document.addEventListener('visibilitychange', function () { if (document.hidden) push(); });
  setInterval(function () { if (getq().length) push(); }, 60000);
})();
KT.sync(2500);
</script>
