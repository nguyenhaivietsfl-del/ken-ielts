<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c5c">
<title>KEN IELTS Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#14232b;--muted:#5d6b73;--bg:#f6f2eb;--card:#fff;--line:#e4ddd1;--brand:#0f4c5c;--brand2:#1d6f80;--soft:#e8f1f2;--accent:#f0a53a;--ok:#2b8a57;--okbg:#e6f4ec;--bad:#c4473d;--badbg:#fbeae8}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.55;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--brand2)}
.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px clamp(16px,4vw,40px);padding-top:max(12px,env(safe-area-inset-top));background:var(--brand);color:#fff}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;color:#fff;text-decoration:none;font-size:17px}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:15px}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:14px;background:rgba(255,255,255,.12);border:0;color:#fff;padding:6px 12px;border-radius:999px;cursor:pointer;font-family:inherit;max-width:55vw}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main#app{width:100%;max-width:1160px;margin:0 auto;padding:clamp(16px,4vw,40px);flex:1}
footer{text-align:center;color:var(--muted);font-size:13px;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
footer button{background:none;border:0;color:var(--brand2);font:inherit;text-decoration:underline;cursor:pointer}
.demo-banner{background:#fff4dc;color:#7a5200;font-size:13px;text-align:center;padding:7px 12px;border-bottom:1px solid #f1dfb4}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(30px,5.2vw,48px);letter-spacing:-.5px}
h2{font-size:clamp(20px,3vw,24px)}
.eyebrow{display:inline-block;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--brand2);background:var(--soft);padding:5px 10px;border-radius:999px}
.lead{color:var(--muted);font-size:17px;max-width:46ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,3vw,28px);box-shadow:0 10px 30px -18px rgba(15,76,92,.35)}
.hero{display:grid;gap:30px;align-items:center}
@media(min-width:860px){.hero{grid-template-columns:1.05fr 1fr;min-height:62vh}}
.hero-points{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.hero-points span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:14px}
label small{font-weight:400;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;width:100%;margin-top:6px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
textarea{min-height:140px;resize:vertical;line-height:1.5}
textarea.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;min-height:300px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px rgba(29,111,128,.16)}
.err-text{color:var(--bad);font-size:14px;min-height:1.2em;margin:-4px 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;border:1.5px solid transparent;font:inherit;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .08s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand2)}
.btn.accent{background:var(--accent);color:#3a2500}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn.danger{background:#fff;border-color:#f0c9c4;color:var(--bad)}
.btn.big{width:100%;min-height:52px;font-size:16px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.grid2{display:grid;gap:0 14px}
@media(min-width:600px){.grid2{grid-template-columns:1fr 1fr}}
/* danh sách đề */
.list-head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;flex-wrap:wrap}
.seg button{border:0;background:none;font:inherit;font-weight:600;font-size:14px;padding:8px 14px;border-radius:9px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--brand);color:#fff}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.toolbar input,.toolbar select{margin:0;flex:1;min-width:160px}
.vol-h{margin:26px 0 12px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.tests{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tcard{display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;position:relative;overflow:hidden}
.tcard::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--brand2)}
.tcard.Listening::before{background:var(--accent)}
.tcard h3{font-size:17px;margin:2px 0 0}
.meta{display:flex;gap:10px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--soft);color:var(--brand)}
.tag.Listening{background:#fdf0dc;color:#8a5a00}
.badge{font-size:12.5px;background:var(--okbg);color:var(--ok);padding:3px 10px;border-radius:999px;font-weight:600;align-self:flex-start}
.tcard .btn{margin-top:auto}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.loading{text-align:center;color:var(--muted);padding:50px 0}
.loading::before{content:"";display:block;width:32px;height:32px;margin:0 auto 12px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* phòng thi */
body.testing .topbar,body.testing footer,body.testing .demo-banner{display:none}
body.testing main#app{max-width:none;padding:0}
.test{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:30}
.test-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:var(--brand);color:#fff}
.tb-title{flex:1;min-width:0;line-height:1.25}
.tb-title b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title small{opacity:.8;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.timer{font-variant-numeric:tabular-nums;font-weight:700;background:rgba(255,255,255,.14);padding:7px 12px;border-radius:999px;white-space:nowrap;font-size:15px}
.timer.warn{background:var(--bad);animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.7}}
.test-bar .btn{background:var(--accent);color:#3a2500;min-height:40px}
.test-bar .btn[disabled]{background:rgba(255,255,255,.18);color:#fff;opacity:1}
.viol-chip{font-size:12px;background:var(--bad);border-radius:999px;padding:4px 9px;font-weight:700}
.rule{background:#fff8e6;color:#6b4a00;font-size:13px;padding:6px 14px;border-bottom:1px solid #f1dfb4;text-align:center}
.mtabs{display:none;background:#fff;border-bottom:1px solid var(--line)}
.mtabs button{flex:1;border:0;background:none;font:inherit;font-weight:600;padding:11px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.mtabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.test-body{flex:1;min-height:0;display:flex;position:relative}
.pane{min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:clamp(14px,2.6vw,30px);padding-bottom:60px}
.passage{flex:0 0 50%;background:#fffdf8}
.questions{flex:1}
.divider{flex:0 0 10px;cursor:col-resize;background:var(--line);position:relative;touch-action:none}
.divider::after{content:"⋮";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--muted);font-weight:700;background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 1px;font-size:14px}
.passage article{max-width:700px;margin:0 auto;font-family:'Source Serif 4',Georgia,serif;font-size:17.5px;line-height:1.75}
.passage article p{margin:0 0 1em}
.passage article strong:first-child{font-family:'Be Vietnam Pro',sans-serif}
.part-banner{background:var(--soft);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:14px;font-family:'Be Vietnam Pro',sans-serif}
.part-banner b{color:var(--brand)}
.qwrap{max-width:760px;margin:0 auto;font-size:16px}
.qwrap p{margin:.45em 0}
.qwrap blockquote{margin:.3em 0 .6em 1.2em;padding:0}
.qwrap table{border-collapse:collapse;width:100%;margin:10px 0;font-size:15px;background:#fff}
.qwrap td,.qwrap th{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.qwrap th{background:var(--soft)}
.qwrap img,.passage img{max-width:100%;height:auto;border-radius:8px;display:block;margin:8px auto}
.qn-b{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 5px;border-radius:7px;background:var(--ink);color:#fff;font-size:13px;font-family:'Be Vietnam Pro',sans-serif;vertical-align:middle}
input.ans{display:inline-block;width:10.5em;max-width:100%;margin:2px 4px;padding:5px 9px;border:0;border-bottom:2px solid var(--brand2);border-radius:8px 8px 0 0;background:#eef4f5;font-weight:600;font-size:16px;vertical-align:middle;font-family:inherit}
input.ans.short{width:4.2em;text-align:center}
input.ans:focus{background:#fff4dc;box-shadow:none;border-bottom-color:var(--accent)}
input.ans.filled{background:#dcebee}
.is-reading input.ans{text-transform:lowercase}
.is-listening input.ans{text-transform:uppercase}
.ans-box{margin-top:18px;padding:14px;border:1.5px dashed var(--brand2);border-radius:14px;background:#fff}
.ans-box label{display:inline-flex;align-items:center;gap:4px;margin:4px 8px 4px 0;font-weight:600}
.flash{animation:flash 1.4s}
mark.hl{background:#ffe066;color:inherit;border-radius:2px;padding:0 1px;cursor:pointer}
.hl-bar{position:fixed;z-index:60;display:flex;gap:4px;background:var(--ink);border-radius:12px;padding:5px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.hl-bar button{border:0;border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;background:transparent;color:#fff;white-space:nowrap}
.hl-bar button.y{background:#ffe066;color:#3a2a00}
.passage article{-webkit-user-select:text;user-select:text}
.hl-tip{font-size:12.5px;color:var(--muted);margin:-8px 0 14px;font-family:'Be Vietnam Pro',sans-serif}
@keyframes flash{0%,40%{background:#ffe2a8}100%{background:#eef4f5}}
.bottom{background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.ptabs{display:flex;gap:6px;padding:8px 10px 0;overflow-x:auto}
.ptabs button{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.ptabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.ptabs button small{font-weight:500;opacity:.8}
.qnav{display:flex;gap:5px;overflow-x:auto;padding:8px 10px}
.qnav button{flex:0 0 auto;width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font:inherit;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink)}
.qnav button.done{background:var(--brand2);color:#fff;border-color:var(--brand2)}
.qnav button.cur{outline:2px solid var(--accent)}
@media(max-width:859px){
  .is-reading .mtabs{display:flex}
  .is-reading .divider{display:none}
  .is-reading .passage{flex:1}
  .is-reading .test-body[data-show=passage] .questions{display:none}
  .is-reading .test-body[data-show=questions] .passage{display:none}
  .tb-title small{display:none}
  .test-bar .btn{padding:8px 10px;font-size:14px}
  .timer{font-size:14px;padding:6px 10px}
}
/* audio */
.audio-panel{position:sticky;top:-1px;z-index:6;background:var(--bg);padding:4px 0 12px}
.audio-inner{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 6px 18px -12px rgba(0,0,0,.25)}
.a-state{font-weight:700;font-size:15px;flex:1;min-width:160px}
.a-state small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.a-bar{flex:1 1 100%;height:8px;background:#ece6db;border-radius:99px;overflow:hidden}
.a-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s linear}
.vol{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.vol input{width:110px;margin:0;padding:0;accent-color:var(--brand);-webkit-appearance:auto;appearance:auto;border:0}
.listen-part{scroll-margin-top:110px}
.listen-part>h3{margin:28px 0 8px;padding:8px 12px;background:var(--brand);color:#fff;border-radius:10px;font-size:16px}
/* kết quả */
.result{max-width:780px;margin:0 auto}
.score-wrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.ring{--p:0;width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--brand2) calc(var(--p)*1%),#e8e2d7 0);display:grid;place-items:center;flex:0 0 150px}
.ring div{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}
.ring b{font-size:34px;line-height:1}
.ring small{color:var(--muted);font-size:13px}
.band{font-size:15px;color:var(--muted)}
.band b{display:inline-block;font-size:30px;color:var(--ink);background:#fdf0dc;border-radius:12px;padding:2px 12px;margin-left:6px}
.info-grid{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin-top:14px}
.info-grid span:nth-child(odd){color:var(--muted)}
.review{margin-top:22px}
.rv-grid{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.rv{display:grid;grid-template-columns:30px 1fr 22px;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;font-size:14px}
.rv.ok{background:var(--okbg)}
.rv.bad{background:var(--badbg)}
.rv .n{font-weight:700}
.rv .lbl{display:block;font-size:12px;color:var(--muted)}
/* giáo viên */
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.adm-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.adm-row .t{flex:1;min-width:200px}
.adm-row .t b{display:block}
.sw{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer;margin:0;padding:5px 10px;border-radius:8px;border:1.5px solid var(--line);background:#fff;user-select:none}
.sw.on{background:var(--okbg);border-color:#b9dfc8;color:var(--ok)}
.editor{display:grid;gap:20px}
@media(min-width:1000px){.editor.with-preview{grid-template-columns:1fr 1fr}}
.preview{background:#fff;border:1px dashed var(--brand2);border-radius:16px;padding:18px;max-height:85vh;overflow:auto}
.errs{background:var(--badbg);color:var(--bad);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.oks{background:var(--okbg);color:var(--ok);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:12px}
details.help{background:var(--soft);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:14px}
details.help summary{cursor:pointer;font-weight:700}
details.help pre{white-space:pre-wrap;background:#fff;border-radius:8px;padding:10px;font-size:13px;overflow:auto}
.check{display:flex;align-items:center;gap:10px;font-weight:600;margin-bottom:12px}
.check input{width:20px;height:20px;margin:0;-webkit-appearance:checkbox;appearance:checkbox;accent-color:var(--brand)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff;max-height:70vh}
table.res{border-collapse:collapse;width:100%;font-size:14px}
table.res th,table.res td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.res th{background:var(--soft);position:sticky;top:0}
td.v-bad{color:var(--bad);font-weight:700}
.filters{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.filters input,.filters select{margin-top:0}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:20px;color:var(--ink)}
/* hộp thoại */
.modal-bg{position:fixed;inset:0;background:rgba(20,35,43,.5);display:grid;place-items:center;z-index:100;padding:16px}
.modal{max-width:440px;width:100%}
.modal p{color:var(--muted)}
.modal.warn{border-top:6px solid var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw;text-align:center}
.overlay{position:fixed;inset:0;background:rgba(246,242,235,.9);display:grid;place-items:center;z-index:150;font-weight:600}

.tcard.Writing::before{background:#7a5cc4}.tcard.Speaking::before{background:#c4473d}
.tag.Writing{background:#efe9fb;color:#5a3ea8}.tag.Speaking{background:#fbeae8;color:#a3352c}
details.grp{margin:6px 0}details.grp>summary{cursor:pointer;list-style:none;padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;margin:10px 0}
details.grp>summary::before{content:"▸ ";color:var(--brand2)}details.grp[open]>summary::before{content:"▾ "}
details.grp>summary small{font-weight:500;text-transform:none;letter-spacing:0}
.wpart{margin-bottom:30px;scroll-margin-top:10px}
.wpart>h3{padding:8px 12px;background:var(--brand);color:#fff;border-radius:10px;font-size:16px}
.wprompt{background:#fff;border:1.5px solid var(--brand2);border-radius:14px;padding:10px 16px}.wprompt p{margin:.4em 0}
.wq2{font-size:17px;font-weight:600;line-height:1.55}
img.t1img{max-width:100%;max-height:70vh;margin:12px auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.wbox{margin-top:10px}
textarea.wtext{min-height:340px;font-size:16.5px;line-height:1.65;font-family:'Source Serif 4',Georgia,serif;background:#fffdf8}
.wc{font-size:13.5px;font-weight:700;margin-top:4px;text-align:right}.wc.low{color:#b26b00}.wc.ok{color:var(--ok)}
.is-writing .ptabs button{cursor:pointer}
.sp-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,26px);margin-top:6px}
.sp-q{font-size:20px;font-weight:700;line-height:1.4;margin:14px 0}
.cuecard{border:2px solid var(--brand2);border-radius:14px;padding:12px 18px;margin:12px 0;background:#fffdf8;font-size:16.5px}.cuecard p{margin:.25em 0}.cuecard .cc-h{font-weight:700;font-size:18px}
label.notes{margin-top:10px}label.notes textarea{min-height:110px}
.sp-state{font-weight:700;font-size:17px;margin:14px 0 8px}.sp-state.rec{color:var(--bad)}.sp-state.prep{color:var(--brand2)}
.meter{margin:12px 0}.meter .a-bar i{background:var(--ok);transition:width .08s}
#spParts button[disabled]{opacity:1;cursor:default}
.sub-row{border-bottom:1px solid var(--line);padding:12px 0}.sub-row summary{cursor:pointer;display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ===== PHẦN DÙNG CHUNG (giống hệt ở index.html và Code.gs) ===== */
function normAns(s) {
  return String(s == null ? '' : s).toLowerCase()
    .replace(/[’‘`´]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-')
    .replace(/(\d),(?=\d{3}\b)/g, '$1')
    .replace(/\s+/g, ' ').replace(/^[\s.,;:!?"]+|[\s.,;:!?"]+$/g, '').trim();
}
/* "B (in either order)", "April 12/12 April", "(some) 800 km", "E if visuals…" → các đáp án chấp nhận */
function parseKey(raw) {
  var s = String(raw == null ? '' : raw).trim();
  var eo = /\((in )?(either|any) order\)/i.test(s);
  s = s.replace(/\((in )?(either|any) order\)/ig, '').trim();
  var show = s, acc = [];
  var add = function (v) { v = normAns(v); if (v && acc.indexOf(v) < 0) acc.push(v); };
  var lm = s.match(/^([A-Z])\s+(\S.*)$/);
  if (lm && !/^[A-Z]{2,}/.test(lm[2])) { add(lm[1]); show = lm[1]; return { acc: acc, eo: eo, show: show }; }
  s.split(/\s*\/\s*|,\s+(?!\d{3}\b)/).forEach(function (alt) {
    if (!alt) return;
    if (/\(.*\)/.test(alt)) { add(alt.replace(/\([^)]*\)/g, ' ')); add(alt.replace(/[()]/g, ' ')); }
    else add(alt);
  });
  var tf = { 'true': ['t'], 'false': ['f'], 'not given': ['ng', 'notgiven'], 'yes': ['y'], 'no': ['n'] };
  if (acc.length === 1 && tf[acc[0]]) tf[acc[0]].forEach(add);
  return { acc: acc, eo: eo, show: show };
}
/* keys: {n: "đáp án"}; groups: [[20,21],…] câu "either order" */
function gradeAnswers(keys, groups, answers, type) {
  answers = answers || {};
  var nums = Object.keys(keys).map(Number).sort(function (a, b) { return a - b; });
  var K = {}; nums.forEach(function (n) { K[n] = parseKey(keys[n]); });
  var ok = {};
  var inGroup = {};
  (groups || []).forEach(function (g) {
    var slots = g.slice(), given = g.map(function (n) { return normAns(answers[n]); });

      var a = given[i]; if (!a) return;

      }
    });

  var review = nums.map(function (n) {
    if (ok[n]) score++;

  });

    score: score, total: nums.length, band: bandScore(type, score, nums.length), review: review,
    detail: review.map(function (r) { return r.n + ':' + (r.your || '-') + (r.ok ? '✓' : '✗'); }).join('  ')
  };
}
function bandScore(type, score, total) {
  if (!total) return 0;
  var s = Math.round(score * 40 / total);
  var L = [[39, 9], [37, 8.5], [35, 8], [32, 7.5], [30, 7], [26, 6.5], [23, 6], [18, 5.5], [16, 5], [13, 4.5], [10, 4], [8, 3.5], [6, 3], [4, 2.5], [3, 2], [1, 1]];
  var R = [[39, 9], [37, 8.5], [35, 8], [33, 7.5], [30, 7], [27, 6.5], [23, 6], [19, 5.5], [15, 5], [13, 4.5], [10, 4], [8, 3.5], [6, 3], [4, 2.5], [3, 2], [1, 1]];
  var tbl = type === 'Listening' ? L : R;
  for (var i = 0; i < tbl.length; i++) if (s >= tbl[i][0]) return tbl[i][1];

function toBool(v) { return v === true || String(v).toUpperCase() === 'TRUE' || v === 1 || v === '1'; }
function escHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

function parseKeysText(raw) {

}

  var g = [], run = [];
  Object.keys(k).map(Number).sort(function (a, b) { return a - b; }).forEach(function (n) {
    var eo = parseKey(k[n]).eo;
    if (eo && run.length && run[run.length - 1] === n - 1) { run.push(n); return; }

}
function textToHtml(t, isQ) {
  return String(t || '').split(/\r?\n/).map(function (l) {
    var s = l.trim(); if (!s) return '';

/* nội dung: "=== Part 1 | 1-13" … "--- QUESTIONS" … */

  });
}
function fmtTime(sec) { sec = Math.max(0, Math.floor(sec)); var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? h + ':' : '') + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }

  if (!o.name || !o.sid || !o.school || !o.cls) throw new Error('Thiếu thông tin học viên.');

}
function customCard(t) { var k = parseKeysText(t.keys); return { id: t.id, type: t.type, title: t.title, source: 'Đề giáo viên', minutes: +t.minutes || 0, audio: t.audio, duration: +t.duration || 0, count: Object.keys(k).length, custom: true }; }

  var o = { id: String(t.id || '') || ('C' + Date.now().toString(36)), title: String(t.title || '').trim(), type: t.type === 'Listening' ? 'Listening' : 'Reading', minutes: parseInt(t.minutes, 10) || 0, audio: String(t.audio || '').trim(), duration: parseInt(t.duration, 10) || 0, content: String(t.content || ''), keys: String(t.keys || ''), active: toBool(t.active), showKey: toBool(t.showKey) };

}

function api(action, data) {

  if (MODE === 'demo') return new Promise(function (res, rej) { setTimeout(function () { try { res(demoApi(body)); } catch (e) { rej(e); } }, 150); });

/* chế độ dùng thử: lưu trên máy, chấm bằng DEMO_KEYS nếu có */

      } else { var c = find(b.id); keys = parseKeysText(c.keys); groups = keyGroups(keys); type = c.type; title = c.title; show = c.showKey; }

      results.unshift({ time: new Date().toLocaleString('vi-VN'), name: s.name, sid: s.sid, school: s.school, cls: s.cls, testId: b.id, testTitle: title, type: type, score: g.score, total: g.total, band: g.band, duration: Math.round((+b.duration || 0) / 6) / 10, violations: (b.viol || []).length, violLog: violText(b.viol), detail: g.detail });

    var m = tx.match(/^(\d{1,2})(?:\s*(?:[–-]|and|&)\s*(\d{1,2}))?(?=[\s.)]|$)/);

    if (!list.length) return;

    if (list.length === 1) {
      var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), node, re = /(?:…{2,}|\.{3,}|_{3,})[….]*/;
      while ((node = walker.nextNode())) {
        if (re.test(node.nodeValue)) {
          var parts = node.nodeValue.split(re), span = document.createElement('span');
          span.innerHTML = esc(parts[0]) + input(list[0]) + esc(parts.slice(1).join(''));
          node.parentNode.replaceChild(span, node);
          return;
        }
      }
    }
    el.insertAdjacentHTML('beforeend', ' ' + list.map(function (n) { return '<span style="white-space:nowrap">→ ' + input(n, true) + '</span>'; }).join(' '));
  });
  var rest = nums.filter(function (n) { return !placed[n]; });
  var out = box.innerHTML;
  if (rest.length) out += '<div class="ans-box"><b>Ô trả lời</b><br>' + rest.map(function (n) { return '<label><span class="qn-b">' + n + '</span>' + input(n, true) + '</label>'; }).join('') + '</div>';
  return { html: out, fallback: rest };
}

var hlBar = null, hlMark = null;
function hlEl() {

    hlBar.innerHTML = '<button class="y" data-a="add">🖍 Tô vàng</button><button data-a="del">✕ Xóa tô</button><button data-a="clear">Xóa hết</button>';
    hlBar.addEventListener('mousedown', function (e) { e.preventDefault(); });

      var b = e.target.closest('button'); if (!b) return;
      var a = b.getAttribute('data-a');
      if (a === 'add') addHl(); else if (a === 'del' && hlMark) unwrap(hlMark); else if (a === 'clear') [].slice.call(document.querySelectorAll('#art mark.hl')).forEach(unwrap);
      saveHl(); hideHl();
    });
    document.body.appendChild(hlBar);
  }
  return hlBar;
}
function hideHl() { if (hlBar) hlBar.classList.add('hidden'); hlMark = null; }
function showHlAt(rect, mode) {
  var bar = hlEl(); bar.classList.remove('hidden');
  bar.children[0].style.display = mode === 'add' ? '' : 'none';
  bar.children[1].style.display = mode === 'del' ? '' : 'none';
  bar.children[2].style.display = document.querySelector('#art mark.hl') ? '' : 'none';
  var touch = matchMedia('(pointer: coarse)').matches;

  var left = Math.max(8, Math.min(innerWidth - bar.offsetWidth - 8, rect.left + rect.width / 2 - bar.offsetWidth / 2));
  bar.style.top = top + 'px'; bar.style.left = left + 'px';
}
function selInArt() {
  var s = window.getSelection(), art = document.getElementById('art');
  if (!s || s.isCollapsed || !s.rangeCount || !art) return null;
  var r = s.getRangeAt(0);
  return art.contains(r.commonAncestorContainer) && String(s).trim() ? r : null;
}
function addHl() {
  var r = selInArt(); if (!r) return;
  var nodes = [], w = document.createTreeWalker(r.commonAncestorContainer.nodeType === 3 ? r.commonAncestorContainer.parentNode : r.commonAncestorContainer, NodeFilter.SHOW_TEXT), n;
  while ((n = w.nextNode())) if (r.intersectsNode(n) && n.nodeValue.trim()) nodes.push(n);
  nodes.forEach(function (node) {
    var s = node === r.startContainer ? r.startOffset : 0, e = node === r.endContainer ? r.endOffset : node.nodeValue.length;
    if (e <= s) return;
    if (node.parentNode.closest && node.parentNode.closest('mark.hl')) return;
    var mid = node.splitText(s); mid.splitText(e - s);
    var m = document.createElement('mark'); m.className = 'hl';
    mid.parentNode.replaceChild(m, mid); m.appendChild(mid);
  });

}

/* ---- đồng hồ & khoá nộp sớm ---- */

}

/* ---- nộp bài ---- */

/* ================= WRITING & SPEAKING (IELTS) ================= */

}

      '<select id="fSchool"><option value="">Tất cả trường</option>' + uniq('school').map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') + '</select>' +
      '<input id="fCls" placeholder="Lọc theo lớp…"><input id="fName" placeholder="Tìm tên / mã SV…"></div>' +
      '<div class="stats" id="stats"></div><div class="row" style="margin-bottom:12px"><button class="btn ghost sm" id="csv">⬇ Tải file Excel (CSV)</button><button class="btn ghost sm" id="reload">↻ Làm mới</button></div>' +
      '<div class="tbl-wrap"><table class="res"><thead><tr><th>Thời gian</th><th>Họ tên</th><th>Mã SV/HS</th><th>Trường</th><th>Lớp</th><th>Đề</th><th>Điểm</th><th>Band</th><th>Phút</th><th>Vi phạm</th></tr></thead><tbody id="rtb"></tbody></table></div>';
    ['fTest', 'fSchool', 'fCls', 'fName'].forEach(function (id) { document.getElementById(id).addEventListener('input', drawRes); });
    document.getElementById('csv').onclick = downloadCSV;
    document.getElementById('reload').onclick = adminResults;
    drawRes();
  }).catch(adminErr);
}
function filteredRes() {
  var g = function (id) { return document.getElementById(id).value.trim().toLowerCase(); };
  var ft = g('fTest'), fs = g('fSchool'), fc = g('fCls'), fn = g('fName');
  return adminRes.filter(function (x) {
    return (!ft || String(x.testTitle).toLowerCase() === ft) && (!fs || String(x.school).toLowerCase() === fs) && (!fc || String(x.cls).toLowerCase().indexOf(fc) > -1) && (!fn || (x.name + ' ' + x.sid).toLowerCase().indexOf(fn) > -1);
  });
}
function drawRes() {
  var rows = filteredRes();
  var avg = rows.length ? rows.reduce(function (s, x) { return s + (+x.band || 0); }, 0) / rows.length : 0;
  var people = {}; rows.forEach(function (x) { people[x.sid] = 1; });
  var vio = rows.filter(function (x) { return +x.violations > 0; }).length;
  document.getElementById('stats').innerHTML = '<div class="stat"><b>' + rows.length + '</b>lượt nộp</div><div class="stat"><b>' + Object.keys(people).length + '</b>học viên</div><div class="stat"><b>' + (rows.length ? bandText(avg) : '–') + '</b>band TB</div><div class="stat"><b>' + vio + '</b>bài có vi phạm</div>';
  document.getElementById('rtb').innerHTML = rows.length ? rows.map(function (x) {
    return '<tr title="' + esc(x.violLog || '') + '"><td>' + esc(x.time) + '</td><td>' + esc(x.name) + '</td><td>' + esc(x.sid) + '</td><td>' + esc(x.school) + '</td><td>' + esc(x.cls) + '</td><td>' + esc(x.testTitle) + '</td><td><b>' + esc(x.score) + '</b>/' + esc(x.total) + '</td><td>' + esc(x.band) + '</td><td>' + esc(x.duration) + '</td><td class="' + (+x.violations ? 'v-bad' : '') + '">' + (+x.violations || 0) + '</td></tr>';
  }).join('') : '<tr><td colspan="10" class="empty">Chưa có kết quả.</td></tr>';
}
function downloadCSV() {
  var cols = ['time', 'name', 'sid', 'school', 'cls', 'testTitle', 'type', 'score', 'total', 'band', 'duration', 'violations', 'violLog', 'detail'];
  var head = ['Thời gian', 'Họ tên', 'Mã SV/HS', 'Trường', 'Lớp', 'Đề', 'Kỹ năng', 'Điểm', 'Tổng câu', 'Band', 'Phút', 'Số lần vi phạm', 'Chi tiết vi phạm', 'Chi tiết bài làm'];
  var q = function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
  var csv = '﻿' + [head.map(q).join(',')].concat(filteredRes().map(function (r) { return cols.map(function (c) { return q(r[c]); }).join(','); })).join('\r\n');
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'ket-qua-ielts.csv'; document.body.appendChild(a); a.click(); a.remove();
}

/* ================= ĐIỀU HƯỚNG ================= */
function goHome() { if (location.hash) location.hash = ''; else route(); }
function route() {
  clearInterval(timerId); app.onclick = null;
  if (location.hash === '#admin') return renderAdmin();
  updateWho();
  if (!student) return renderInfo();
  renderList();
}
document.getElementById('homeLink').onclick = function (e) { e.preventDefault(); if (!document.body.classList.contains('testing')) goHome(); };
document.getElementById('adminLink').onclick = function () { location.hash = '#admin'; };
document.getElementById('whoBtn').onclick = function () { renderInfo(); };
window.addEventListener('hashchange', function () { if (!document.body.classList.contains('testing')) route(); });
window.addEventListener('beforeunload', function (e) { if (document.body.classList.contains('testing') && !submitting) { e.preventDefault(); e.returnValue = ''; } });
if (MODE === 'demo') document.getElementById('demoBanner').classList.remove('hidden');
route();
</script>
